<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thank You - Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

.card{
  background:#1a1a22;
  padding:20px;
  border-radius:12px;
  width:300px;
}

h1{
  margin:0 0 10px 0;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="card">
  <h1>🎉 Thank You!</h1>
  <p id="status">Loading your beat...</p>

  <div id="beatInfo"></div>

  <button id="downloadBtn" style="display:none;">
    Download WAV
  </button>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

/* GET BEAT ID FROM URL */
const params = new URLSearchParams(window.location.search);
const beatId = params.get("beat");

/* ELEMENTS */
const status = document.getElementById("status");
const beatInfo = document.getElementById("beatInfo");
const downloadBtn = document.getElementById("downloadBtn");

if(!beatId){
  status.innerText = "No beat found.";
}
else{

  db.collection("beats").doc(beatId).get().then(doc=>{
    if(!doc.exists){
      status.innerText = "Beat not found.";
      return;
    }

    const b = doc.data();

    status.innerText = "Payment successful!";

    beatInfo.innerHTML = `
      <h3>${b.title}</h3>
      <p>${b.producer}</p>
      <p>${b.tempo} BPM</p>
      <p>$${b.price}</p>
    `;

    if(b.wavFile){
      downloadBtn.style.display = "block";
      downloadBtn.onclick = () => {
        window.open(b.wavFile, "_blank");
      };
    }

  });

}
</script>

</body>
</html>
