<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thank You</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#1a1a22;
  padding:25px;
  border-radius:12px;
  width:320px;
  text-align:center;
}

a{
  display:block;
  margin-top:10px;
  padding:10px;
  background:#6d3cff;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="box">
  <h2>🎉 Thank You</h2>
  <p id="title">Loading...</p>

  <div id="downloads" style="display:none;">
    <a id="mp3" href="#" download>Download MP3</a>
    <a id="wav" href="#" download>Download WAV</a>
  </div>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

const params = new URLSearchParams(window.location.search);
const beatId = params.get("beat");

if(beatId){

  db.collection("beats").doc(beatId).get().then(doc=>{

    if(!doc.exists){
      title.innerText = "Beat not found";
      return;
    }

    const b = doc.data();

    title.innerText = b.title;

    mp3.href = b.previewFile || "#";
    wav.href = b.wavFile || "#";

    downloads.style.display = "block";
  });

}else{
  title.innerText = "No purchase detected";
}
</script>

</body>
</html>
