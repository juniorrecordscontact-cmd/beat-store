<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Thank You - Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#1a1a22;
  padding:20px;
  border-radius:12px;
  width:320px;
  text-align:center;
}

h1{
  margin:0 0 10px 0;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

.locked{
  opacity:0.4;
  pointer-events:none;
}
</style>

</head>

<body>

<div class="card">
  <h1>🎉 Thank You</h1>

  <p id="status">Verifying purchase...</p>

  <div id="beatInfo"></div>

  <button id="downloadBtn" class="locked">
    Download WAV
  </button>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

/* URL DATA */
const params = new URLSearchParams(window.location.search);
const beatId = params.get("beat");
const sessionId = params.get("session_id");

/* ELEMENTS */
const status = document.getElementById("status");
const beatInfo = document.getElementById("beatInfo");
const downloadBtn = document.getElementById("downloadBtn");

/* BASIC SECURITY CHECK */
if(!beatId || !sessionId){
  status.innerText = "Invalid access.";
}
else{

  db.collection("beats").doc(beatId).get().then(doc=>{

    if(!doc.exists){
      status.innerText = "Beat not found.";
      return;
    }

    const b = doc.data();

    status.innerText = "Payment Confirmed ✔";

    beatInfo.innerHTML = `
      <h3>${b.title}</h3>
      <p>${b.producer}</p>
      <p>${b.tempo} BPM</p>
      <p>$${b.price}</p>
    `;

    /* SIMPLE PRO GATE */
    const accessKey = beatId + "_" + sessionId;

    localStorage.setItem(accessKey, "paid");

    downloadBtn.classList.remove("locked");

    downloadBtn.onclick = () => {
      window.open(b.wavFile, "_blank");
    };

  });

}
</script>

</body>
</html>
