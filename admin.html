<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f0f12;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:20px;
}

.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button{
  width:300px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:6px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

#panel{
  display:none;
  padding:20px;
}

.section{
  margin-top:20px;
  border-top:1px solid #333;
  padding-top:20px;
}

.beatRow{
  background:#1a1a20;
  padding:10px;
  margin:10px;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats Admin</h1>

<div id="loginBox" class="center">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="panel">

<div class="section">
  <button onclick="logout()" style="background:#ff3b3b;">Logout</button>
</div>

<!-- SITE SETTINGS -->
<div class="section">
<h2>Site Settings</h2>

<input id="storeName" placeholder="Store Name">
<input id="slogan" placeholder="Slogan">
<input id="logo" placeholder="Logo URL">

<button onclick="saveSettings()">Save Settings</button>
</div>

<!-- UPLOAD BEAT -->
<div class="section">
<h2>Upload Beat</h2>

<input id="title" placeholder="Title">
<input id="producer" placeholder="Producer">
<input id="price" placeholder="Price">
<input id="tempo" placeholder="BPM">

<input id="image" placeholder="Image URL">
<input id="preview" placeholder="MP3 URL">
<input id="wav" placeholder="WAV URL">

<input id="genres" placeholder="Genres (comma separated)">

<input id="stripeLink" placeholder="Stripe Payment Link">
<input id="youtubeLink" placeholder="YouTube Video Link">
<input id="coupon" placeholder="Coupon Code (optional)">

<button onclick="addBeat()">Upload</button>
<button onclick="updateBeat()">Update Selected</button>
<button onclick="deleteBeat()">Delete Selected</button>
</div>

<!-- BEAT LIST -->
<div class="section">
<h2>Beats</h2>
<div id="beatList"></div>
</div>

<!-- 🔥 SALES DASHBOARD (NEW) -->
<div class="section">
<h2>Sales Dashboard</h2>

<div id="salesList"></div>

<h3 id="totalEarnings">Total Earnings: $0</h3>

<h3>Top Selling Beats</h3>
<div id="topBeats"></div>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let selectedBeatId = null;

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(err=>alert(err.message));
}

auth.onAuthStateChanged(user=>{
  if(!user) return;
  loginBox.style.display="none";
  panel.style.display="block";
  loadBeats();
  loadSales(); // 🔥 NEW
});

function logout(){
  auth.signOut().then(()=>location.reload());
}

/* SETTINGS */
function saveSettings(){
  db.collection("settings").doc("site").set({
    storeName:storeName.value,
    slogan:slogan.value,
    logo:logo.value
  }, { merge:true });
}

/* ADD BEAT */
function addBeat(){

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value || 0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genresArray,

    stripeLink: stripeLink.value || "",
    youtubeLink: youtubeLink.value || "",
    coupon: coupon.value || "",

    createdAt:Date.now()
  });

  alert("Uploaded");
}

/* UPDATE */
function updateBeat(){

  if(!selectedBeatId) return alert("Select beat first");

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").doc(selectedBeatId).update({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value || 0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genresArray,

    stripeLink: stripeLink.value || "",
    youtubeLink: youtubeLink.value || "",
    coupon: coupon.value || ""
  });

  alert("Updated");
}

/* DELETE */
function deleteBeat(){
  if(!selectedBeatId) return;
  db.collection("beats").doc(selectedBeatId).delete();
  selectedBeatId=null;
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";
    snap.forEach(doc=>{
      let b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow" onclick="selectBeat('${doc.id}')">
          <b>${b.title}</b><br>
          ${b.producer}<br>
          $${b.price}
        </div>
      `;
    });
  });
}

/* SELECT */
function selectBeat(id){
  selectedBeatId=id;

  db.collection("beats").doc(id).get().then(doc=>{
    let b = doc.data();

    title.value=b.title || "";
    producer.value=b.producer || "";
    price.value=b.price || "";
    tempo.value=b.tempo || "";
    image.value=b.image || "";
    preview.value=b.previewFile || "";
    wav.value=b.wavFile || "";
    genres.value=(b.genres || []).join(", ");

    stripeLink.value=b.stripeLink || "";
    youtubeLink.value=b.youtubeLink || "";
    coupon.value=b.coupon || "";
  });
}

/* 🔥 SALES SYSTEM */
function loadSales(){

  db.collection("sales").onSnapshot(snap=>{

    let salesList = document.getElementById("salesList");
    let totalEarnings = document.getElementById("totalEarnings");
    let topBeats = document.getElementById("topBeats");

    salesList.innerHTML = "";
    topBeats.innerHTML = "";

    let total = 0;
    let beatCount = {};

    snap.forEach(doc=>{
      let s = doc.data();

      total += Number(s.price || 0);

      beatCount[s.title] = (beatCount[s.title] || 0) + 1;

      salesList.innerHTML += `
        <div class="beatRow">
          <b>${s.title}</b><br>
          $${s.price}
        </div>
      `;
    });

    totalEarnings.innerText = "Total Earnings: $" + total.toFixed(2);

    // TOP BEATS
    let sorted = Object.entries(beatCount)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,5);

    sorted.forEach(b=>{
      topBeats.innerHTML += `
        <div class="beatRow">
          ${b[0]} - ${b[1]} sales
        </div>
      `;
    });

  });
}
</script>

</body>
</html>
