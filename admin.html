<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f0f12;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:20px;
}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  padding:20px;
}

.box{
  background:#1a1a20;
  padding:20px;
  border-radius:12px;
  border:1px solid #2b2b35;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:none;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

.beatRow{
  background:#111;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.small{
  font-size:12px;
  color:#aaa;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats Admin Dashboard</h1>

<div class="container">

<!-- SETTINGS -->
<div class="box">
<h2>⚙️ Site Settings</h2>

<input id="slogan" placeholder="Slogan (By Jayan Reid)">
<input id="storeName" placeholder="Store Name">
<input id="bg" placeholder="Background URL">

<button onclick="saveSettings()">Save Settings</button>
</div>

<!-- UPLOAD BEATS -->
<div class="box">
<h2>🎧 Upload Beat</h2>

<input id="title" placeholder="Title">
<input id="producer" placeholder="Producer Name">
<input id="price" placeholder="Price">
<input id="tempo" placeholder="BPM">

<input id="image" placeholder="Image URL">
<input id="preview" placeholder="MP3 URL">
<input id="wav" placeholder="WAV URL">

<button onclick="addBeat()">Upload Beat</button>
</div>

<!-- BEATS LIST -->
<div class="box">
<h2>📀 Manage Beats</h2>
<div id="beatList"></div>
</div>

<!-- PURCHASES -->
<div class="box">
<h2>💰 Purchases</h2>
<div id="purchaseList"></div>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

/* =========================
   SAVE SETTINGS
========================= */
function saveSettings(){
  db.collection("settings").doc("site").set({
    slogan: slogan.value,
    storeName: storeName.value,
    bg: bg.value
  });
}

/* =========================
   ADD BEAT
========================= */
function addBeat(){
  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    createdAt:Date.now()
  });
}

/* =========================
   LOAD BEATS
========================= */
db.collection("beats")
.onSnapshot(snap=>{
  beatList.innerHTML="";
  snap.forEach(doc=>{
    let b = doc.data();

    beatList.innerHTML += `
      <div class="beatRow">
        <b>${b.title}</b><br>
        <span class="small">By ${b.producer || "Unknown"}</span><br>
        $${b.price} • ${b.tempo} BPM
      </div>
    `;
  });
});

/* =========================
   LOAD PURCHASES
========================= */
db.collection("purchases")
.orderBy("createdAt","desc")
.onSnapshot(snap=>{
  purchaseList.innerHTML="";
  snap.forEach(doc=>{
    let p = doc.data();

    purchaseList.innerHTML += `
      <div class="beatRow">
        <b>${p.beatTitle}</b><br>
        ${p.email}<br>
        $${p.amount} • ${p.status}
      </div>
    `;
  });
});
</script>

</body>
</html>
