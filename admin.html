<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0b0b10;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:18px;
  font-size:20px;
}

.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button,textarea{
  width:320px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

#panel{
  display:none;
  padding:20px;
}

/* KPI */
.kpiGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.kpi{
  background:#151520;
  padding:15px;
  border-radius:10px;
  border:1px solid #222;
}

.kpi h2{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

.kpi p{
  font-size:20px;
  margin:8px 0 0;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

/* SECTIONS */
.section{
  background:#12121a;
  padding:15px;
  border-radius:10px;
  border:1px solid #222;
}

.section h2{
  margin-top:0;
  font-size:14px;
}

/* ROWS */
.beatRow, .saleRow, .noteRow{
  background:#1a1a22;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  font-size:12px;
}

/* NOTES */
.noteRow{
  border-left:3px solid #6d3cff;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small{
  font-size:11px;
  opacity:0.7;
}

.deleteBtn{
  background:#ff3b3b;
  padding:5px 8px;
  font-size:10px;
  width:auto;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats — Control Center</h1>

<div id="loginBox" class="center">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="panel">

<!-- KPI -->
<div class="kpiGrid">
  <div class="kpi">
    <h2>Total Earnings</h2>
    <p id="earnings">$0</p>
  </div>

  <div class="kpi">
    <h2>Total Sales</h2>
    <p id="salesCount">0</p>
  </div>

  <div class="kpi">
    <h2>Top Beat</h2>
    <p id="topBeat">-</p>
  </div>

  <div class="kpi">
    <h2>Active Beats</h2>
    <p id="beatCount">0</p>
  </div>
</div>

<div class="grid">

<!-- SALES -->
<div class="section">
<h2>📊 Live Sales</h2>
<div id="salesList"></div>
</div>

<!-- TOP BEATS -->
<div class="section">
<h2>🏆 Top Beats</h2>
<div id="topBeats"></div>
</div>

<!-- BEATS -->
<div class="section">
<h2>🎵 Beats</h2>
<div id="beatList"></div>
</div>

<!-- SETTINGS -->
<div class="section">
<h2>⚙ Settings</h2>
<input id="storeName" placeholder="Store Name">
<input id="slogan" placeholder="Slogan">
<input id="logo" placeholder="Logo URL">
<button onclick="saveSettings()">Save</button>
</div>

<!-- NOTES (NEW OFFICE SYSTEM) -->
<div class="section">
<h2>🗒 Office Notes</h2>

<textarea id="noteInput" placeholder="Write a note..."></textarea>
<button onclick="addNote()">Add Note</button>

<div id="notesList"></div>
</div>

</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let selectedBeatId = null;

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

auth.onAuthStateChanged(user=>{
  if(!user) return;

  loginBox.style.display="none";
  panel.style.display="block";

  loadBeats();
  loadSales();
  loadNotes(); // 🔥 NEW
});

/* SETTINGS */
function saveSettings(){
  db.collection("settings").doc("site").set({
    storeName:storeName.value,
    slogan:slogan.value,
    logo:logo.value
  },{merge:true});
}

/* BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";
    let count = 0;

    snap.forEach(doc=>{
      count++;
      const b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow">
          ${b.title} <span class="small">$${b.price}</span>
        </div>
      `;
    });

    beatCount.innerText = count;
  });
}

/* SALES */
function loadSales(){

  db.collection("sales").onSnapshot(snap=>{

    let salesList = document.getElementById("salesList");

    salesList.innerHTML="";

    let total = 0;
    let count = {};
    let totalSales = 0;

    snap.forEach(doc=>{
      const s = doc.data();

      total += Number(s.price || 0);
      totalSales++;

      count[s.title] = (count[s.title] || 0) + 1;

      salesList.innerHTML += `
        <div class="saleRow">
          🎵 ${s.title}<br>
          💰 $${s.price}
        </div>
      `;
    });

    earnings.innerText = "$" + total.toFixed(2);
    salesCount.innerText = totalSales;

    let sorted = Object.entries(count)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,5);

    if(sorted[0]){
      topBeat.innerText = sorted[0][0];
    }

    let topBeats = document.getElementById("topBeats");
    topBeats.innerHTML="";

    sorted.forEach((b,i)=>{
      topBeats.innerHTML += `
        <div class="beatRow">
          #${i+1} ${b[0]} — ${b[1]} sales
        </div>
      `;
    });

  });
}

/* NOTES SYSTEM (NEW) */
function addNote(){

  if(!noteInput.value.trim()) return;

  db.collection("notes").add({
    text: noteInput.value,
    createdAt: Date.now()
  });

  noteInput.value = "";
}

/* LOAD NOTES */
function loadNotes(){

  db.collection("notes")
    .orderBy("createdAt","desc")
    .onSnapshot(snap=>{

      notesList.innerHTML="";

      snap.forEach(doc=>{
        const n = doc.data();

        notesList.innerHTML += `
          <div class="noteRow">
            <div>${n.text}</div>
            <button class="deleteBtn" onclick="deleteNote('${doc.id}')">X</button>
          </div>
        `;
      });

    });
}

/* DELETE NOTE */
function deleteNote(id){
  db.collection("notes").doc(id).delete();
}
</script>

</body>
</html>
