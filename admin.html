<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
}

/* HEADER */
h1{
  text-align:center;
  padding:20px;
  font-weight:600;
}

/* LOGIN CENTER */
.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button{
  width:320px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

/* MAIN PANEL */
#panel{
  display:none;
  padding:20px;
}

/* DASHBOARD GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

/* CARD STYLE */
.card{
  background:#1a1a22;
  padding:15px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card h2{
  margin-top:0;
  font-size:16px;
  color:#d0c6ff;
}

/* NOTES */
.note{
  background:#252533;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  font-size:12px;
}

/* BEAT LIST */
.beatRow{
  background:#252533;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

/* SMALL BUTTONS */
.smallBtn{
  width:100%;
  margin-top:6px;
  padding:8px;
  font-size:12px;
  border-radius:6px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats Admin Office</h1>

<div id="loginBox" class="center">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="panel">

<button onclick="logout()" style="background:#ff3b3b; width:200px;">
Logout
</button>

<br><br>

<div class="grid">

  <!-- SETTINGS -->
  <div class="card">
    <h2>Site Settings</h2>
    <input id="storeName" placeholder="Store Name">
    <input id="slogan" placeholder="Slogan">
    <input id="logo" placeholder="Logo URL">
    <button class="smallBtn" onclick="saveSettings()">Save</button>
  </div>

  <!-- UPLOAD -->
  <div class="card">
    <h2>Upload Beat</h2>

    <input id="title" placeholder="Title">
    <input id="producer" placeholder="Producer">
    <input id="price" placeholder="Price">
    <input id="tempo" placeholder="BPM">

    <input id="image" placeholder="Image URL">
    <input id="preview" placeholder="MP3 Preview">
    <input id="wav" placeholder="WAV File">

    <input id="genres" placeholder="Genres">

    <input id="stripeLink" placeholder="Stripe Link">
    <input id="youtubeLink" placeholder="YouTube Link">

    <button class="smallBtn" onclick="addBeat()">Upload</button>
    <button class="smallBtn" onclick="updateBeat()">Update</button>
    <button class="smallBtn" onclick="deleteBeat()">Delete</button>
  </div>

  <!-- NOTES (NEW) -->
  <div class="card">
    <h2>Office Notes 📝</h2>

    <input id="noteInput" placeholder="Write a note...">
    <button class="smallBtn" onclick="addNote()">Add Note</button>

    <div id="notesList"></div>
  </div>

  <!-- BEATS -->
  <div class="card">
    <h2>Beats</h2>
    <div id="beatList"></div>
  </div>

</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let selectedBeatId = null;

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(err=>alert(err.message));
}

auth.onAuthStateChanged(user=>{
  if(!user) return;
  loginBox.style.display="none";
  panel.style.display="block";
  loadBeats();
  loadNotes();
});

function logout(){
  auth.signOut().then(()=>location.reload());
}

/* SETTINGS */
function saveSettings(){
  db.collection("settings").doc("site").set({
    storeName:storeName.value,
    slogan:slogan.value,
    logo:logo.value
  }, { merge:true });
}

/* BEATS */
function addBeat(){
  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value||0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genres.value.split(",").map(g=>g.trim()),
    stripeLink:stripeLink.value,
    youtubeLink:youtubeLink.value,
    createdAt:Date.now()
  });
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";
    snap.forEach(doc=>{
      let b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow" onclick="selectBeat('${doc.id}')">
          <b>${b.title}</b><br>
          $${b.price}
        </div>
      `;
    });
  });
}

/* SELECT */
function selectBeat(id){
  selectedBeatId = id;

  db.collection("beats").doc(id).get().then(doc=>{
    let b = doc.data();

    title.value=b.title||"";
    producer.value=b.producer||"";
    price.value=b.price||"";
    tempo.value=b.tempo||"";
    image.value=b.image||"";
    preview.value=b.previewFile||"";
    wav.value=b.wavFile||"";
    genres.value=(b.genres||[]).join(", ");
    stripeLink.value=b.stripeLink||"";
    youtubeLink.value=b.youtubeLink||"";
  });
}

/* NOTES SYSTEM */
function addNote(){
  db.collection("notes").add({
    text:noteInput.value,
    createdAt:Date.now()
  });
  noteInput.value="";
}

function loadNotes(){
  db.collection("notes").onSnapshot(snap=>{
    notesList.innerHTML="";
    snap.forEach(doc=>{
      let n = doc.data();

      notesList.innerHTML += `
        <div class="note">
          ${n.text}
        </div>
      `;
    });
  });
}

/* UPDATE + DELETE */
function updateBeat(){
  if(!selectedBeatId) return;

  db.collection("beats").doc(selectedBeatId).update({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value||0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genres.value.split(",").map(g=>g.trim()),
    stripeLink:stripeLink.value,
    youtubeLink:youtubeLink.value
  });
}

function deleteBeat(){
  if(!selectedBeatId) return;
  db.collection("beats").doc(selectedBeatId).delete();
}
</script>

</body>
</html>
