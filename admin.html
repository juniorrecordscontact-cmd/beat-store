<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f0f12;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:20px;
}

.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button,textarea{
  width:300px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:6px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

#panel{
  display:none;
  padding:20px;
}

.section{
  margin-top:20px;
  border-top:1px solid #333;
  padding-top:20px;
}

.beatRow{
  background:#1a1a20;
  padding:10px;
  margin:10px;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats Admin</h1>

<!-- LOGIN -->
<div id="loginBox" class="center">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel">

<div class="section">
  <button onclick="logout()" style="background:#ff3b3b;">Logout</button>
</div>

<!-- SETTINGS -->
<div class="section">
<h2>⚙️ Site Settings</h2>

<input id="storeName" placeholder="Store Name">
<input id="slogan" placeholder="Slogan">
<input id="bg" placeholder="Background Image URL">
<input id="logo" placeholder="Logo Image URL">
<input id="font" placeholder="Font">

<button onclick="saveSettings()">Save Settings</button>
</div>

<!-- BEATS -->
<div class="section">
<h2>🎧 Beats</h2>

<input id="title" placeholder="Title">
<input id="producer" placeholder="Producer">
<input id="price" placeholder="Price">
<input id="tempo" placeholder="BPM">

<input id="image" placeholder="Image URL">
<input id="preview" placeholder="MP3 URL">
<input id="wav" placeholder="WAV URL">
<input id="genres" placeholder="Genres (comma separated)">

<label>
  <input type="checkbox" id="featured"> Featured Beat
</label>

<button onclick="addBeat()">Upload Beat</button>
<button onclick="updateBeat()">Update Selected</button>
<button onclick="deleteBeat()">Delete Selected</button>

<div id="beatList"></div>
</div>

<!-- 📊 DASHBOARD -->
<div class="section">
<h2>📊 Dashboard Stats</h2>
<button onclick="loadStats()">Refresh Stats</button>
<div id="statsBox"></div>
</div>

<!-- 🎥 VIDEOS -->
<div class="section">
<h2>🎥 YouTube Videos</h2>

<input id="videoTitle" placeholder="Video Title">
<input id="videoURL" placeholder="YouTube Embed URL">

<button onclick="addVideo()">Add Video</button>
</div>

<!-- 💸 COUPONS -->
<div class="section">
<h2>💸 Coupons</h2>

<input id="couponCode" placeholder="Coupon Code">
<input id="discount" placeholder="Discount %">

<button onclick="createCoupon()">Create Coupon</button>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let selectedBeatId = null;

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(err=>alert(err.message));
}

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user) return;
  loginBox.style.display="none";
  panel.style.display="block";
  loadBeats();
});

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location.reload());
}

/* SETTINGS */
function saveSettings(){
  db.collection("settings").doc("site").set({
    storeName:storeName.value || "",
    slogan:slogan.value || "",
    bg:bg.value || "",
    logo:logo.value || "",
    font:font.value || ""
  }, { merge:true });

  alert("Saved");
}

/* BEATS */
function addBeat(){

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").add({
    title:title.value || "",
    producer:producer.value || "",
    price:Number(price.value || 0),
    tempo:tempo.value || "",
    image:image.value || "",
    previewFile:preview.value || "",
    wavFile:wav.value || "",
    genres:genresArray,
    featured:featured.checked || false,
    plays:0,
    createdAt:Date.now()
  });

  alert("Uploaded");
}

function updateBeat(){

  if(!selectedBeatId) return alert("Select beat");

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").doc(selectedBeatId).update({
    title:title.value,
    producer:producer.value,
    price:Number(price.value),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genresArray,
    featured:featured.checked || false
  });

  alert("Updated");
}

function deleteBeat(){
  if(!selectedBeatId) return;
  db.collection("beats").doc(selectedBeatId).delete();
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";

    snap.forEach(doc=>{
      const b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow" onclick="selectBeat('${doc.id}')">
          <b>${b.title}</b><br>
          ${b.producer} • $${b.price}<br>
          Plays: ${b.plays || 0}
          ${b.featured ? "🔥 Featured" : ""}
        </div>
      `;
    });
  });
}

/* SELECT */
function selectBeat(id){
  selectedBeatId = id;

  db.collection("beats").doc(id).get().then(doc=>{
    const b = doc.data();

    title.value=b.title || "";
    producer.value=b.producer || "";
    price.value=b.price || "";
    tempo.value=b.tempo || "";
    image.value=b.image || "";
    preview.value=b.previewFile || "";
    wav.value=b.wavFile || "";
    genres.value=(b.genres || []).join(", ");
    featured.checked=b.featured || false;
  });
}

/* 📊 STATS */
function loadStats(){

  let totalPlays = 0;
  let beatCount = 0;

  db.collection("beats").get().then(snap=>{
    beatCount = snap.size;

    snap.forEach(doc=>{
      totalPlays += doc.data().plays || 0;
    });

    statsBox.innerHTML = `
      <p>🎧 Beats: ${beatCount}</p>
      <p>▶ Total Plays: ${totalPlays}</p>
    `;
  });
}

/* 🎥 VIDEO */
function addVideo(){
  db.collection("videos").add({
    title:videoTitle.value,
    url:videoURL.value,
    createdAt:Date.now()
  });

  alert("Video added");
}

/* 💸 COUPON */
function createCoupon(){
  db.collection("coupons").doc(couponCode.value).set({
    code:couponCode.value,
    discount:Number(discount.value),
    active:true
  });

  alert("Coupon created");
}
</script>

</body>
</html>
