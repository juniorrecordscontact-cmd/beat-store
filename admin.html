<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f0f12;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:20px;
}

.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button,select{
  width:300px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:6px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

#panel{
  display:none;
  padding:20px;
  text-align:center;
}

.section{
  margin-top:20px;
  border-top:1px solid #333;
  padding-top:20px;
}

.beatRow{
  background:#1a1a20;
  padding:10px;
  margin:10px;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats Admin</h1>

<!-- LOGIN -->
<div id="loginBox" class="center">
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel">

<div class="section">
  <button onclick="logout()" style="background:#ff3b3b;">🚪 Logout</button>
</div>

<!-- SETTINGS -->
<div class="section">
<h2>⚙️ Site Settings</h2>

<input id="slogan" placeholder="Slogan"><br>
<input id="storeName" placeholder="Store Name"><br>
<input id="bg" placeholder="Background Image URL"><br>
<input id="logo" placeholder="Logo Image URL"><br>
<input id="font" placeholder="Font (Arial, Poppins, etc)"><br>

<button onclick="saveSettings()">Save Settings</button>
</div>

<!-- UPLOAD -->
<div class="section">
<h2>🎧 Upload Beat</h2>

<input id="title" placeholder="Title"><br>
<input id="producer" placeholder="Producer"><br>
<input id="price" placeholder="Price"><br>
<input id="tempo" placeholder="BPM"><br>

<!-- 🔥 GENRES ADDED (NO REMOVALS) -->
<select id="genre1">
  <option value="">Genre 1</option>
  <option>Pop</option>
  <option>Acoustic</option>
  <option>Trap</option>
  <option>Hip-Hop</option>
  <option>RnB</option>
  <option>Drill</option>
  <option>Lofi</option>
  <option>Afrobeats</option>
  <option>Electro</option>
  <option>Dance</option>
  <option>Jazz</option>
  <option>Soul</option>
  <option>Pop-Rock</option>
  <option>Dark Trap</option>
  <option>Chill</option>
</select>

<select id="genre2">
  <option value="">Genre 2 (optional)</option>
  <option>Pop</option>
  <option>Acoustic</option>
  <option>Trap</option>
  <option>Hip-Hop</option>
  <option>RnB</option>
  <option>Drill</option>
  <option>Lofi</option>
  <option>Afrobeats</option>
  <option>Electro</option>
  <option>Dance</option>
  <option>Jazz</option>
  <option>Soul</option>
  <option>Pop-Rock</option>
  <option>Dark Trap</option>
  <option>Chill</option>
</select>

<select id="genre3">
  <option value="">Genre 3 (optional)</option>
  <option>Pop</option>
  <option>Acoustic</option>
  <option>Trap</option>
  <option>Hip-Hop</option>
  <option>RnB</option>
  <option>Drill</option>
  <option>Lofi</option>
  <option>Afrobeats</option>
  <option>Electro</option>
  <option>Dance</option>
  <option>Jazz</option>
  <option>Soul</option>
  <option>Pop-Rock</option>
  <option>Dark Trap</option>
  <option>Chill</option>
</select>

<input id="image" placeholder="Image URL"><br>
<input id="preview" placeholder="MP3 URL"><br>
<input id="wav" placeholder="WAV URL"><br>

<button onclick="addBeat()">Upload</button>
<button onclick="updateBeat()">Update Selected</button>
<button onclick="deleteBeat()">Delete Selected</button>
</div>

<!-- BEATS -->
<div class="section">
<h2>📀 Beats (Click to Select)</h2>
<div id="beatList"></div>
</div>

<!-- PURCHASES -->
<div class="section">
<h2>💰 Purchases</h2>
<div id="purchaseList"></div>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let selectedBeatId = null;

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(err=>alert(err.message));
}

auth.onAuthStateChanged(user=>{
  if(!user) return;

  loginBox.style.display="none";
  panel.style.display="block";

  loadBeats();
  loadPurchases();
});

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location.reload());
}

/* SETTINGS */
function saveSettings(){
  db.collection("settings").doc("site").set({
    slogan:slogan.value,
    storeName:storeName.value,
    bg:bg.value,
    logo:logo.value,
    font:font.value
  });

  alert("Settings saved ✔");
}

/* ADD BEAT (GENRES ADDED ONLY) */
function addBeat(){

  const genres = [
    genre1.value,
    genre2.value,
    genre3.value
  ].filter(g => g && g.trim() !== "").slice(0,3);

  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,

    // 🔥 ADDED ONLY
    genres: genres,

    createdAt:Date.now()
  });

  alert("Uploaded ✔");
}

/* UPDATE */
function updateBeat(){
  if(!selectedBeatId) return alert("Select a beat first");

  const genres = [
    genre1.value,
    genre2.value,
    genre3.value
  ].filter(g => g && g.trim() !== "").slice(0,3);

  db.collection("beats").doc(selectedBeatId).update({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,

    // 🔥 ADDED ONLY
    genres: genres
  });

  alert("Updated ✔");
}

/* DELETE */
function deleteBeat(){
  if(!selectedBeatId) return alert("Select a beat first");

  db.collection("beats").doc(selectedBeatId).delete();
  selectedBeatId=null;

  alert("Deleted ✔");
}

/* SELECT */
function selectBeat(id){
  selectedBeatId=id;

  db.collection("beats").doc(id).get().then(doc=>{
    let b = doc.data();

    title.value=b.title;
    producer.value=b.producer;
    price.value=b.price;
    tempo.value=b.tempo;
    image.value=b.image;
    preview.value=b.previewFile;
    wav.value=b.wavFile;

    // 🔥 LOAD GENRES BACK INTO SELECTS
    genre1.value = b.genres?.[0] || "";
    genre2.value = b.genres?.[1] || "";
    genre3.value = b.genres?.[2] || "";
  });
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";

    snap.forEach(doc=>{
      let b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow" onclick="selectBeat('${doc.id}')">
          <b>${b.title}</b><br>
          By ${b.producer || "Unknown"}<br>
          $${b.price} • ${b.tempo} BPM<br>
          ${(b.genres||[]).join(", ")}
        </div>
      `;
    });
  });
}

/* PURCHASES */
function loadPurchases(){
  db.collection("purchases")
  .orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    purchaseList.innerHTML="";

    snap.forEach(doc=>{
      let p = doc.data();

      purchaseList.innerHTML += `
        <div class="beatRow">
          <b>${p.beatTitle}</b><br>
          ${p.email}<br>
          $${p.amount} • ${p.status}
        </div>
      `;
    });
  });
}
</script>

</body>
</html>
