<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f0f12;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:20px;
}

.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button{
  width:300px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:6px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

#panel{
  display:none;
  padding:20px;
  text-align:center;
}

.section{
  margin-top:20px;
  border-top:1px solid #333;
  padding-top:20px;
}

.beatRow{
  background:#1a1a20;
  padding:10px;
  margin:10px;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats Admin</h1>

<!-- LOGIN -->
<div id="loginBox" class="center">
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel">

<!-- LOGOUT -->
<div class="section">
  <button onclick="logout()" style="background:#ff3b3b;">
    🚪 Logout
  </button>
</div>

<!-- SETTINGS -->
<div class="section">
<h2>⚙️ Site Settings</h2>

<input id="slogan" placeholder="Slogan (By Jayan Reid)">
<input id="storeName" placeholder="Store Name">
<input id="bg" placeholder="Background URL">
<input id="logo" placeholder="Logo Image URL">

<button onclick="saveSettings()">Save Settings</button>
</div>

<!-- UPLOAD -->
<div class="section">
<h2>🎧 Upload Beat</h2>

<input id="title" placeholder="Title"><br>
<input id="producer" placeholder="Producer"><br>
<input id="price" placeholder="Price"><br>
<input id="tempo" placeholder="BPM"><br>

<input id="image" placeholder="Image URL"><br>
<input id="preview" placeholder="MP3 URL"><br>
<input id="wav" placeholder="WAV URL"><br>

<button onclick="addBeat()">Upload</button>
</div>

<!-- BEATS -->
<div class="section">
<h2>📀 Beats</h2>
<div id="beatList"></div>
</div>

<!-- PURCHASES -->
<div class="section">
<h2>💰 Purchases</h2>
<div id="purchaseList"></div>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(err=>alert(err.message));
}

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user) return;

  loginBox.style.display="none";
  panel.style.display="block";

  loadBeats();
  loadPurchases();
});

/* LOGOUT */
function logout(){
  auth.signOut().then(()=>location.reload());
}

/* SETTINGS SAVE (UPDATED WITH LOGO) */
function saveSettings(){
  db.collection("settings").doc("site").set({
    slogan: slogan.value,
    storeName: storeName.value,
    bg: bg.value,
    logo: logo.value
  });

  alert("Settings saved ✔");
}

/* ADD BEAT */
function addBeat(){
  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    createdAt:Date.now()
  });

  alert("Uploaded ✔");
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats")
  .onSnapshot(snap=>{
    beatList.innerHTML="";
    snap.forEach(doc=>{
      let b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow">
          <b>${b.title}</b><br>
          By ${b.producer || "Unknown"}<br>
          $${b.price} • ${b.tempo} BPM
        </div>
      `;
    });
  });
}

/* LOAD PURCHASES */
function loadPurchases(){
  db.collection("purchases")
  .orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    purchaseList.innerHTML="";
    snap.forEach(doc=>{
      let p = doc.data();

      purchaseList.innerHTML += `
        <div class="beatRow">
          <b>${p.beatTitle}</b><br>
          ${p.email}<br>
          $${p.amount} • ${p.status}
        </div>
      `;
    });
  });
}
</script>

</body>
</html>
