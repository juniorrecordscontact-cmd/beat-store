<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0b0b10;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:16px;
  font-size:20px;
}

.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button,textarea{
  width:320px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

/* PANEL */
#panel{
  display:none;
  padding:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

/* SECTIONS */
.section{
  background:#12121a;
  padding:14px;
  border-radius:10px;
  border:1px solid #222;
  margin-bottom:12px;
}

.section h2{
  margin-top:0;
  font-size:14px;
}

/* ROWS */
.beatRow,.saleRow,.noteRow{
  background:#1a1a22;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.noteRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.deleteBtn{
  background:#ff3b3b;
  width:auto;
  padding:5px 8px;
  font-size:10px;
}

/* KPI */
.kpiGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-bottom:15px;
}

.kpi{
  background:#151520;
  padding:14px;
  border-radius:10px;
  border:1px solid #222;
}

.kpi h2{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

.kpi p{
  font-size:18px;
  margin-top:8px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats — Admin Control Center</h1>

<!-- LOGIN -->
<div id="loginBox" class="center">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel">

<button onclick="logout()" style="background:#ff3b3b;width:120px;">
Logout
</button>

<!-- KPI -->
<div class="kpiGrid">
  <div class="kpi">
    <h2>Earnings</h2>
    <p id="earnings">$0</p>
  </div>

  <div class="kpi">
    <h2>Sales</h2>
    <p id="salesCount">0</p>
  </div>

  <div class="kpi">
    <h2>Top Beat</h2>
    <p id="topBeat">-</p>
  </div>

  <div class="kpi">
    <h2>Beats</h2>
    <p id="beatCount">0</p>
  </div>
</div>

<div class="grid">

<!-- SALES -->
<div class="section">
<h2>📊 Sales</h2>
<div id="salesList"></div>
</div>

<!-- TOP -->
<div class="section">
<h2>🏆 Top Beats</h2>
<div id="topBeats"></div>
</div>

<!-- BEATS -->
<div class="section">
<h2>🎵 Beats (click to edit)</h2>
<div id="beatList"></div>
</div>

<!-- UPLOAD / EDIT -->
<div class="section">
<h2>🎛 Upload / Edit Beat</h2>

<input id="title" placeholder="Title">
<input id="producer" placeholder="Producer">
<input id="price" placeholder="Price">
<input id="tempo" placeholder="BPM">

<input id="image" placeholder="Image URL">
<input id="preview" placeholder="MP3 URL">
<input id="wav" placeholder="WAV URL">

<input id="genres" placeholder="Genres">

<input id="stripeLink" placeholder="Stripe Link">
<input id="youtubeLink" placeholder="YouTube Link">
<input id="coupon" placeholder="Coupon">

<button onclick="addBeat()">Upload Beat</button>
<button onclick="updateBeat()">Update Beat</button>
<button onclick="deleteBeat()">Delete Beat</button>
</div>

<!-- NOTES -->
<div class="section">
<h2>🗒 Notes</h2>

<textarea id="noteInput" placeholder="Write note..."></textarea>
<button onclick="addNote()">Add Note</button>

<div id="notesList"></div>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let selectedBeatId = null;

/* LOGIN FIXED */
auth.onAuthStateChanged(user=>{
  if(user){
    loginBox.style.display="none";
    panel.style.display="block";

    loadBeats();
    loadSales();
    loadNotes();
  } else {
    panel.style.display="none";
    loginBox.style.display="flex";
  }
});

function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

function logout(){
  auth.signOut();
}

/* ADD BEAT */
function addBeat(){

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value||0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genresArray,
    stripeLink:stripeLink.value||"",
    youtubeLink:youtubeLink.value||"",
    coupon:coupon.value||"",
    createdAt:Date.now()
  });

  alert("Uploaded");
}

/* SELECT BEAT */
function selectBeat(id){
  selectedBeatId = id;

  db.collection("beats").doc(id).get().then(doc=>{
    const b = doc.data();

    title.value=b.title||"";
    producer.value=b.producer||"";
    price.value=b.price||"";
    tempo.value=b.tempo||"";
    image.value=b.image||"";
    preview.value=b.previewFile||"";
    wav.value=b.wavFile||"";
    genres.value=(b.genres||[]).join(", ");

    stripeLink.value=b.stripeLink||"";
    youtubeLink.value=b.youtubeLink||"";
    coupon.value=b.coupon||"";
  });
}

/* UPDATE */
function updateBeat(){

  if(!selectedBeatId) return alert("Select a beat first");

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").doc(selectedBeatId).update({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value||0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genresArray,
    stripeLink:stripeLink.value||"",
    youtubeLink:youtubeLink.value||"",
    coupon:coupon.value||""
  });

  alert("Updated");
}

/* DELETE */
function deleteBeat(){

  if(!selectedBeatId) return alert("Select beat first");

  db.collection("beats").doc(selectedBeatId).delete();
  selectedBeatId=null;

  alert("Deleted");
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";
    let count=0;

    snap.forEach(doc=>{
      count++;
      const b=doc.data();

      beatList.innerHTML+=`
        <div class="beatRow" onclick="selectBeat('${doc.id}')">
          <b>${b.title}</b> — $${b.price}
        </div>
      `;
    });

    beatCount.innerText=count;
  });
}

/* SALES */
function loadSales(){
  db.collection("sales").onSnapshot(snap=>{

    let total=0;
    let count=0;
    let map={};

    salesList.innerHTML="";
    topBeats.innerHTML="";

    snap.forEach(doc=>{
      const s=doc.data();

      total+=Number(s.price||0);
      count++;

      map[s.title]=(map[s.title]||0)+1;

      salesList.innerHTML+=`
        <div class="saleRow">
          🎵 ${s.title} — $${s.price}
        </div>
      `;
    });

    earnings.innerText="$"+total.toFixed(2);
    salesCount.innerText=count;

    let sorted=Object.entries(map)
      .sort((a,b)=>b[1]-a[1]);

    if(sorted[0]){
      topBeat.innerText=sorted[0][0];
    }

    sorted.forEach((b,i)=>{
      topBeats.innerHTML+=`
        <div class="beatRow">
          #${i+1} ${b[0]} — ${b[1]}
        </div>
      `;
    });

  });
}

/* NOTES */
function addNote(){
  db.collection("notes").add({
    text:noteInput.value,
    createdAt:Date.now()
  });
  noteInput.value="";
}

function loadNotes(){
  db.collection("notes").onSnapshot(snap=>{
    notesList.innerHTML="";

    snap.forEach(doc=>{
      const n=doc.data();

      notesList.innerHTML+=`
        <div class="noteRow">
          ${n.text}
          <button class="deleteBtn"
            onclick="db.collection('notes').doc('${doc.id}').delete()">
            X
          </button>
        </div>
      `;
    });
  });
}
</script>

</body>
</html>
