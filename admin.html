<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f0f12;
  color:white;
  margin:0;
}

/* 🔥 CENTER LOGIN SCREEN */
.center{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

input,button{
  width:300px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:6px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

/* PANEL */
#panel{
  display:none;
  padding:20px;
  text-align:center;
}

.section{
  margin-top:20px;
  border-top:1px solid #333;
  padding-top:20px;
}

.beatRow{
  background:#1a1a20;
  padding:10px;
  margin:10px;
  border-radius:8px;
}
</style>

</head>

<body>

<h1 style="text-align:center;">🎛 Junior Beats Admin</h1>

<!-- LOGIN (CENTERED) -->
<div id="loginBox" class="center">

  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>

  <button onclick="login()">Login</button>

</div>

<!-- ADMIN PANEL -->
<div id="panel">

<!-- UPLOAD -->
<div class="section">
<h2>🎧 Upload Beat</h2>

<input id="title" placeholder="Title"><br>
<input id="producer" placeholder="Producer"><br>
<input id="price" placeholder="Price"><br>
<input id="tempo" placeholder="BPM"><br>

<input id="image" placeholder="Image URL"><br>
<input id="preview" placeholder="MP3 URL"><br>
<input id="wav" placeholder="WAV URL"><br>

<button onclick="addBeat()">Upload</button>
</div>

<!-- BEATS -->
<div class="section">
<h2>📀 Beats</h2>
<div id="beatList"></div>
</div>

<!-- PURCHASES -->
<div class="section">
<h2>💰 Purchases</h2>
<div id="purchaseList"></div>
</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAIL = "yourgmail@gmail.com";
const ADMIN_CODE = "JAYAN-ADMIN-2026";

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(err=>alert(err.message));
}

/* ADMIN GATE */
auth.onAuthStateChanged(user=>{
  if(user){

    if(user.email !== ADMIN_EMAIL){
      alert("Access denied");
      auth.signOut();
      return;
    }

    const code = prompt("Enter Admin Code:");

    if(code !== ADMIN_CODE){
      alert("Wrong code");
      auth.signOut();
      return;
    }

    loginBox.style.display="none";
    panel.style.display="block";

    loadBeats();
    loadPurchases();
  }
});

/* ADD BEAT */
function addBeat(){
  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    createdAt:Date.now()
  });

  alert("Uploaded ✔");
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats")
  .onSnapshot(snap=>{
    beatList.innerHTML="";
    snap.forEach(doc=>{
      let b = doc.data();

      beatList.innerHTML += `
        <div class="beatRow">
          <b>${b.title}</b><br>
          By ${b.producer || "Unknown"}<br>
          $${b.price} • ${b.tempo} BPM
        </div>
      `;
    });
  });
}

/* LOAD PURCHASES */
function loadPurchases(){
  db.collection("purchases")
  .orderBy("createdAt","desc")
  .onSnapshot(snap=>{
    purchaseList.innerHTML="";
    snap.forEach(doc=>{
      let p = doc.data();

      purchaseList.innerHTML += `
        <div class="beatRow">
          <b>${p.beatTitle}</b><br>
          ${p.email}<br>
          $${p.amount} • ${p.status}
        </div>
      `;
    });
  });
}
</script>

</body>
</html>
