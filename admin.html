<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Junior Beats</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body{
      font-family: Arial;
      padding:20px;
    }

    input, select{
      display:block;
      margin:10px 0;
      padding:8px;
      width:250px;
    }

    button{
      padding:10px 15px;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <h1>Admin Panel</h1>

  <input id="title" placeholder="Beat Title">
  <input id="image" placeholder="Image URL">
  <input id="price" placeholder="Price">
  <input id="buyLink" placeholder="Buy Link">

  <!-- GENRES (MAX 3) -->
  <h3>Genres (Max 3)</h3>

  <select id="genre1">
    <option value="">Genre 1</option>
    <option>Pop</option>
    <option>Acoustic</option>
    <option>Trap</option>
    <option>Hip-Hop</option>
    <option>RnB</option>
    <option>Drill</option>
    <option>Lofi</option>
    <option>Afrobeats</option>
    <option>Electro</option>
    <option>Dance</option>
    <option>Jazz</option>
    <option>Soul</option>
    <option>Pop-Rock</option>
    <option>Dark Trap</option>
    <option>Chill</option>
  </select>

  <select id="genre2">
    <option value="">Genre 2 (optional)</option>
    <option>Pop</option>
    <option>Acoustic</option>
    <option>Trap</option>
    <option>Hip-Hop</option>
    <option>RnB</option>
    <option>Drill</option>
    <option>Lofi</option>
    <option>Afrobeats</option>
    <option>Electro</option>
    <option>Dance</option>
    <option>Jazz</option>
    <option>Soul</option>
    <option>Pop-Rock</option>
    <option>Dark Trap</option>
    <option>Chill</option>
  </select>

  <select id="genre3">
    <option value="">Genre 3 (optional)</option>
    <option>Pop</option>
    <option>Acoustic</option>
    <option>Trap</option>
    <option>Hip-Hop</option>
    <option>RnB</option>
    <option>Drill</option>
    <option>Lofi</option>
    <option>Afrobeats</option>
    <option>Electro</option>
    <option>Dance</option>
    <option>Jazz</option>
    <option>Soul</option>
    <option>Pop-Rock</option>
    <option>Dark Trap</option>
    <option>Chill</option>
  </select>

  <br>

  <button onclick="addBeat()">Add Beat</button>

  <script>
    const db = firebase.firestore();

    function addBeat(){

      const genres = [
        genre1.value,
        genre2.value,
        genre3.value
      ]
      .filter(g => g && g.trim() !== "")
      .slice(0, 3);

      db.collection("beats").add({
        title: title.value,
        image: image.value,
        price: price.value,
        buyLink: buyLink.value,

        genres: genres,

        createdAt: Date.now()
      });

      alert("Beat added with genres!");
    }

  </script>

</body>
</html>
