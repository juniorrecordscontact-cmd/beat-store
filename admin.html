<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats Control Center</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0b0b10;
  color:white;
  margin:0;
}

h1{
  text-align:center;
  padding:16px;
  font-size:20px;
}

/* LOGIN */
.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input,button,textarea{
  width:320px;
  padding:10px;
  margin:6px;
  border:none;
  border-radius:8px;
}

button{
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

/* LAYOUT */
#panel{
  display:none;
  padding:20px;
}

.kpiGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-bottom:15px;
}

.kpi{
  background:#151520;
  padding:14px;
  border-radius:10px;
  border:1px solid #222;
}

.kpi h2{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

.kpi p{
  font-size:18px;
  margin-top:8px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

/* SECTIONS */
.section{
  background:#12121a;
  padding:14px;
  border-radius:10px;
  border:1px solid #222;
}

.section h2{
  margin-top:0;
  font-size:14px;
}

/* ROWS */
.beatRow,.saleRow,.noteRow{
  background:#1a1a22;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  font-size:12px;
}

.small{font-size:11px;opacity:0.7}

/* BUTTON SMALL */
.deleteBtn{
  background:#ff3b3b;
  width:auto;
  padding:5px 8px;
  font-size:10px;
}

/* CANVAS CHART */
canvas{
  width:100%;
  background:#0f0f16;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>🎛 Junior Beats — Boss Control Center</h1>

<div id="loginBox" class="center">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="panel">

<!-- KPI -->
<div class="kpiGrid">
  <div class="kpi">
    <h2>Earnings</h2>
    <p id="earnings">$0</p>
  </div>

  <div class="kpi">
    <h2>Sales</h2>
    <p id="salesCount">0</p>
  </div>

  <div class="kpi">
    <h2>Top Beat</h2>
    <p id="topBeat">-</p>
  </div>

  <div class="kpi">
    <h2>Beats</h2>
    <p id="beatCount">0</p>
  </div>
</div>

<div class="grid">

<!-- SALES -->
<div class="section">
<h2>📊 Sales Feed</h2>
<div id="salesList"></div>
</div>

<!-- TOP -->
<div class="section">
<h2>🏆 Top Beats</h2>
<div id="topBeats"></div>
</div>

<!-- CHART -->
<div class="section">
<h2>📈 Earnings Trend</h2>
<canvas id="chart" height="120"></canvas>
</div>

<!-- UPLOAD (RESTORED FULLY) -->
<div class="section">
<h2>🎵 Upload Beat</h2>

<input id="title" placeholder="Title">
<input id="producer" placeholder="Producer">
<input id="price" placeholder="Price">
<input id="tempo" placeholder="BPM">

<input id="image" placeholder="Image URL">
<input id="preview" placeholder="MP3 URL">
<input id="wav" placeholder="WAV URL">

<input id="genres" placeholder="Genres">

<input id="stripeLink" placeholder="Stripe Link">
<input id="youtubeLink" placeholder="YouTube">
<input id="coupon" placeholder="Coupon">

<button onclick="addBeat()">Upload Beat</button>
<button onclick="updateBeat()">Update</button>
<button onclick="deleteBeat()">Delete</button>
</div>

<!-- BEATS -->
<div class="section">
<h2>🎧 Beats</h2>
<div id="beatList"></div>
</div>

<!-- NOTES -->
<div class="section">
<h2>🗒 Notes</h2>

<textarea id="noteInput" placeholder="Write note..."></textarea>
<button onclick="addNote()">Add Note</button>

<div id="notesList"></div>
</div>

<!-- MARKETING AI PANEL -->
<div class="section">
<h2>🔥 Marketing Suggestions</h2>
<div id="marketing"></div>
</div>

</div>

</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const auth = firebase.auth();
const db = firebase.firestore();

let salesData = [];

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

auth.onAuthStateChanged(user=>{
  if(!user) return;

  loginBox.style.display="none";
  panel.style.display="block";

  loadBeats();
  loadSales();
  loadNotes();
});

/* FIXED BEAT UPLOAD (RESTORED) */
function addBeat(){

  const genresArray = genres.value
    ? genres.value.split(",").map(g=>g.trim())
    : [];

  db.collection("beats").add({
    title:title.value,
    producer:producer.value,
    price:parseFloat(price.value||0),
    tempo:tempo.value,
    image:image.value,
    previewFile:preview.value,
    wavFile:wav.value,
    genres:genresArray,
    stripeLink:stripeLink.value||"",
    youtubeLink:youtubeLink.value||"",
    coupon:coupon.value||"",
    createdAt:Date.now()
  });

  alert("Uploaded");
}

/* LOAD BEATS */
function loadBeats(){
  db.collection("beats").onSnapshot(snap=>{
    beatList.innerHTML="";
    let count=0;

    snap.forEach(doc=>{
      count++;
      const b=doc.data();

      beatList.innerHTML+=`
        <div class="beatRow">
          ${b.title} <span class="small">$${b.price}</span>
        </div>
      `;
    });

    beatCount.innerText=count;
  });
}

/* SALES + ANALYTICS */
function loadSales(){

  db.collection("sales").onSnapshot(snap=>{

    let total=0;
    let count=0;
    let beatCountMap={};
    salesData=[];

    salesList.innerHTML="";
    topBeats.innerHTML="";

    snap.forEach(doc=>{
      const s=doc.data();

      total+=Number(s.price||0);
      count++;

      beatCountMap[s.title]=(beatCountMap[s.title]||0)+1;
      salesData.push(s);

      salesList.innerHTML+=`
        <div class="saleRow">
          🎵 ${s.title}<br>
          💰 $${s.price}
        </div>
      `;
    });

    earnings.innerText="$"+total.toFixed(2);
    salesCount.innerText=count;

    let sorted=Object.entries(beatCountMap)
      .sort((a,b)=>b[1]-a[1]);

    if(sorted[0]) topBeat.innerText=sorted[0][0];

    sorted.slice(0,5).forEach((b,i)=>{
      topBeats.innerHTML+=`
        <div class="beatRow">
          #${i+1} ${b[0]} — ${b[1]} sales
        </div>
      `;
    });

    drawChart();
    marketingIdeas(sorted);
  });
}

/* SIMPLE CHART */
function drawChart(){
  const c=document.getElementById("chart");
  const ctx=c.getContext("2d");

  ctx.clearRect(0,0,c.width,c.height);

  let step=20;
  let x=10;

  salesData.slice(-10).forEach((s,i)=>{
    let h=(s.price||0)*5;

    ctx.fillStyle="#6d3cff";
    ctx.fillRect(x,100-h,15,h);

    x+=step;
  });
}

/* NOTES */
function addNote(){
  db.collection("notes").add({
    text:noteInput.value,
    pinned:false,
    createdAt:Date.now()
  });
  noteInput.value="";
}

function loadNotes(){
  db.collection("notes").onSnapshot(snap=>{
    notesList.innerHTML="";

    snap.forEach(doc=>{
      const n=doc.data();

      notesList.innerHTML+=`
        <div class="noteRow">
          ${n.text}
          <button class="deleteBtn" onclick="db.collection('notes').doc('${doc.id}').delete()">X</button>
        </div>
      `;
    });
  });
}

/* MARKETING AI (RULE BASED) */
function marketingIdeas(sorted){

  let box=document.getElementById("marketing");
  box.innerHTML="";

  if(!sorted[0]) return;

  box.innerHTML=`
    🔥 Push "${sorted[0][0]}" on TikTok  
    🎯 Create 3 reels using your top beat  
    📈 Bundle similar vibe beats  
    💰 Increase price on best seller slightly  
  `;
}
</script>

</body>
</html>
