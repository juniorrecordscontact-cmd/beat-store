<!DOCTYPE html>
<html>
<head>
  <title>Junior Beats</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎧 Junior Beats</h1>
  <button onclick="toggleAdmin()">Admin Panel</button>
</header>

<!-- ADMIN PANEL -->
<div id="admin" class="hidden">
  <h2>Admin Upload</h2>

  <input id="title" placeholder="Beat Title"><br>
  <input id="price" placeholder="Price"><br>
  <input id="image" placeholder="Image URL"><br>
  <input id="audio" placeholder="Audio URL"><br>
  <input id="paylink" placeholder="PayPal Link"><br>

  <button onclick="addBeat()">Add Beat</button>
</div>

<!-- STORE -->
<div id="store"></div>

<script src="app.js"></script>

</body>
</html>
