<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="https://unpkg.com/wavesurfer.js"></script>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
}

.leftHeader{
  display:flex;
  align-items:center;
  gap:10px;
}

#logo{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
}

.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
  font-size:18px;
}

#slogan{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

/* SEARCH */
#searchWrap{
  display:flex;
  align-items:center;
}

#searchInput{
  width:150px;
  padding:6px 8px;
  font-size:12px;
  border:none;
  border-radius:6px;
  background:#1e1e25;
  color:white;
  outline:none;
}

/* STORE */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:15px;
}

/* BEAT CARD */
.beat{
  background:#1a1a22;
  border-radius:12px;
  overflow:hidden;
  transition:0.25s;
}

.beat:hover{
  transform:translateY(-6px);
}

.beat img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.beatContent{
  padding:10px;
}

.meta{
  font-size:11px;
  opacity:0.8;
}

/* BUTTONS */
.buttonGroup{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}

button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
  font-size:12px;
}

/* CART */
#cartBox{
  max-width:520px;
  margin:8px auto;
  padding:8px 10px;
  background:#181820;
  border-radius:10px;
  font-size:12px;
}

/* =========================
   STICKY PLAYER BAR (NEW)
========================= */
#playerBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:80px;
  background:rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  z-index:999;
}

/* waveform container */
#waveform{
  flex:1;
  height:60px;
}

/* play button inside bar */
#playBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#6d3cff;
  border:none;
  cursor:pointer;
}

</style>

</head>

<body>

<header>
  <div class="leftHeader">
    <img id="logo">
    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </div>

  <div id="searchWrap">
    <input id="searchInput" placeholder="Search..." oninput="searchBeats()">
  </div>
</header>

<!-- CART -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
</div>

<!-- STORE -->
<div id="store"></div>

<!-- STICKY PLAYER -->
<div id="playerBar">
  <button id="playBtn" onclick="togglePlay()">▶</button>
  <div id="waveform"></div>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats=[];
let cart=[];
let wavesurfer=null;
let currentTrack=null;
let isPlaying=false;

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(d=>{
  const s=d.data();
  if(!s) return;

  logo.src=s.logo||"";
  storeTitle.innerText=s.storeName||"Junior Beats";
  slogan.innerText=s.slogan||"By Jayan Reid";
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(s=>{
  allBeats=[];
  s.forEach(d=>allBeats.push({id:d.id,...d.data()}));
  render(allBeats);
});

/* RENDER */
function render(list){
  const store=document.getElementById("store");
  store.innerHTML="";

  list.forEach(b=>{

    store.innerHTML+=`
      <div class="beat">

        <img src="${b.image||''}">

        <div class="beatContent">

          <div class="meta">${b.title}</div>
          <div class="meta">${b.producer}</div>
          <div class="meta">$${b.price}</div>

          <div class="buttonGroup">
            <button onclick="play('${b.previewFile}')">▶ Preview</button>
            <button onclick="add('${b.id}')">Add</button>
          </div>

        </div>

      </div>
    `;
  });
}

/* =========================
   WAVEFORM PLAYER (SYNCED)
========================= */
function initWave(url){

  if(wavesurfer){
    wavesurfer.destroy();
  }

  wavesurfer = WaveSurfer.create({
    container:"#waveform",
    waveColor:"#555",
    progressColor:"#6d3cff",
    height:60,
    barWidth:2,
    responsive:true
  });

  wavesurfer.load(url);

  wavesurfer.on("ready", ()=>{
    wavesurfer.play();
    isPlaying=true;
    playBtn.innerText="⏸";
  });

  wavesurfer.on("finish", ()=>{
    isPlaying=false;
    playBtn.innerText="▶";
  });
}

/* PLAY */
function play(url){
  currentTrack=url;
  initWave(url);
}

/* TOGGLE */
function togglePlay(){
  if(!wavesurfer) return;

  if(isPlaying){
    wavesurfer.pause();
    playBtn.innerText="▶";
  }else{
    wavesurfer.play();
    playBtn.innerText="⏸";
  }

  isPlaying=!isPlaying;
}

/* CART */
function add(id){
  const b=allBeats.find(x=>x.id===id);
  if(!b) return;

  cart.push(b);
  renderCart();
}

function renderCart(){
  const box=document.getElementById("cartItems");
  box.innerHTML="";

  let total=0;

  cart.forEach(c=>{
    total+=Number(c.price||0);
    box.innerHTML+=`<div>${c.title}</div>`;
  });

  document.getElementById("cartTotal").innerText="Total: $"+total;
}

</script>

</body>
</html>
