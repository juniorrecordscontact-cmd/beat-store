<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Junior Beats</title>

  <link rel="stylesheet" href="style.css">

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>🎧 Junior Beats</h1>
    <p>Premium Beats • Instant Delivery • Secure Checkout</p>
  </header>

  <!-- CART -->
  <div id="cartBox">

    <h2>🛒 Cart</h2>

    <div id="cartItems"></div>

    <h3 id="cartTotal">
      Total: $0
    </h3>

    <button id="checkoutBtn" onclick="checkoutCart()">
      Checkout
    </button>

  </div>

  <!-- STORE -->
  <div id="store"></div>

  <!-- FLOATING PLAYER -->
  <div id="playerBar">
    <div id="nowPlaying">
      No beat playing
    </div>
  </div>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
