<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
}

.leftHeader{
  display:flex;
  align-items:center;
  gap:10px;
}

#logo{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
}

.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
  font-size:18px;
}

#slogan{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

/* STORE */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:15px;
}

/* BEAT CARD */
.beat{
  background:#1a1a22;
  border-radius:12px;
  overflow:hidden;
  transition:0.25s;
}

.beat:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 25px rgba(0,0,0,0.5);
}

.beat img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.beatContent{
  padding:10px;
}

.beat h3{
  margin:5px 0;
  font-size:14px;
}

.meta{
  font-size:11px;
  opacity:0.8;
}

.genres{
  font-size:10px;
  opacity:0.8;
  margin-top:5px;
}

button{
  width:100%;
  padding:8px;
  margin-top:6px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
  font-size:12px;
  transition:0.2s;
}

button:hover{
  filter:brightness(1.1);
  transform:scale(1.02);
}
</style>

</head>

<body>

<header>
  <div class="leftHeader">
    <img id="logo">
    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </div>
</header>

<div id="store"></div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let audioPlayer = new Audio();
let currentBeatId = null;

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "Junior Beats";
  slogan.innerText = s.slogan || "By Jayan Reid";
  if(s.logo) logo.src = s.logo;
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
});

/* RENDER */
function renderBeats(beats){

  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    let embed = "";
    if(b.youtubeLink){
      let id = "";

      if(b.youtubeLink.includes("youtu.be/")){
        id = b.youtubeLink.split("youtu.be/")[1];
      }
      else if(b.youtubeLink.includes("watch?v=")){
        id = b.youtubeLink.split("watch?v=")[1].split("&")[0];
      }

      if(id){
        embed = `https://www.youtube.com/embed/${id}`;
      }
    }

    store.innerHTML += `
      <div class="beat">

        <img src="${b.image || ''}">

        <div class="beatContent">

          <button onclick="playPreview('${b.previewFile || ''}', '${b.id}')">
            ▶ Play / Pause
          </button>

          <h3>${b.title || ''}</h3>

          <div class="meta">Producer: ${b.producer || 'Unknown'}</div>
          <div class="meta">BPM: ${b.tempo || 'N/A'}</div>
          <div class="meta">$${b.price || 0}</div>

          <div class="genres">
            ${(b.genres || []).join(" • ")}
          </div>

          ${embed ? `
            <iframe width="100%" height="120"
            src="${embed}"
            frameborder="0"
            allowfullscreen></iframe>
          ` : ""}

          <button onclick="buyNow('${b.stripeLink || ''}', '${b.id}')">
            💰 Buy Now
          </button>

        </div>

      </div>
    `;
  });
}

/* PLAY */
function playPreview(url,id){

  if(!url) return;

  if(currentBeatId === id){
    audioPlayer.paused ? audioPlayer.play() : audioPlayer.pause();
    return;
  }

  audioPlayer.src = url;
  audioPlayer.play();
  currentBeatId = id;
}

/* BUY NOW */
function buyNow(link, beatId){

  if(!link){
    alert("No Stripe link");
    return;
  }

  const successURL =
    "https://juniorrecordscontact-cmd.github.io/beat-store/thank-you.html?beat="
    + beatId + "&paid=true";

  const finalLink =
    link + "?success_url=" + encodeURIComponent(successURL);

  window.open(finalLink, "_blank");
}
</script>

</body>
</html>
