<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Junior Beats</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body{
      margin:0;
      transition: all 0.3s ease;
    }

    header{
      display:flex;
      align-items:center;
      gap:12px;
      padding:15px;
    }

    #logo{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:12px;
      background:#222;
    }

    .titleBlock{
      display:flex;
      flex-direction:column;
    }

    #storeTitle{
      margin:0;
      font-size:22px;
    }

    #slogan{
      margin:0;
      opacity:0.7;
      font-size:14px;
    }

    /* GENRE BAR */
    #genreBar{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:10px 15px;
    }

    #genreBar button{
      background:#2a2a2a;
      color:white;
      border:none;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    #genreBar button.active{
      background:#555;
    }

    /* SEARCH */
    #searchWrap{
      padding:10px 15px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #searchInput{
      flex:1;
      max-width:400px;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#222;
      color:white;
      outline:none;
    }

    #searchBtn{
      padding:10px 16px;
      border:none;
      border-radius:8px;
      background:#6d3cff;
      color:white;
      cursor:pointer;
    }

    /* STORE */
    #store{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      padding:20px;
    }

    .beat{
      background:#1b1b22;
      padding:15px;
      border-radius:12px;
      color:white;
    }

    button{
      width:100%;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#6d3cff;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <img id="logo" src="" alt="logo">

    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </header>

  <!-- GENRE BAR -->
  <div id="genreBar"></div>

  <!-- SEARCH -->
  <div id="searchWrap">
    <input id="searchInput" placeholder="Search beats..." onkeypress="handleEnter(event)">
    <button id="searchBtn" onclick="searchBeats()">Search</button>
  </div>

  <!-- CART -->
  <div id="cartBox">
    <h2>🛒 Cart</h2>
    <div id="cartItems"></div>
    <h3 id="cartTotal">Total: $0</h3>
    <button onclick="checkoutCart()">Checkout</button>
  </div>

  <!-- STORE -->
  <div id="store"></div>

  <!-- PLAYER -->
  <div id="playerBar">
    <div id="nowPlaying"></div>
  </div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "";
  slogan.innerText = s.slogan || "";

  if(s.logo){
    logo.src = s.logo;
  }
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
});

/* RENDER */
function renderBeats(beats){

  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    store.innerHTML += `
      <div class="beat">

        <h3>${b.title || ''}</h3>

        <p>${b.producer || ''}</p>

        <p>$${b.price || 0}</p>

        <button onclick="addToCart('${b.id}')">Add to Cart</button>

      </div>
    `;
  });
}

/* ✅ FIXED SEARCH (REAL DATA SEARCH) */
function searchBeats(){

  const value = document.getElementById("searchInput")
    .value.toLowerCase().trim();

  if(value === ""){
    renderBeats(allBeats);
    return;
  }

  const filtered = allBeats.filter(b => {

    const title = (b.title || "").toLowerCase();
    const producer = (b.producer || "").toLowerCase();
    const genres = (b.genres || []).join(" ").toLowerCase();

    return (
      title.includes(value) ||
      producer.includes(value) ||
      genres.includes(value)
    );
  });

  renderBeats(filtered);
}

/* ENTER KEY */
function handleEnter(e){
  if(e.key === "Enter"){
    searchBeats();
  }
}
</script>

</body>
</html>
