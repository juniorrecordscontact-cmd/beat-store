<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Junior Beats</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
    }

    header{
      display:flex;
      align-items:center;
      gap:12px;
      padding:15px;
    }

    #logo{
      width:70px;
      height:70px;
      object-fit:cover;
      border-radius:10px;
    }

    .titleBlock{
      display:flex;
      flex-direction:column;
    }

    #storeTitle{
      margin:0;
      font-size:22px;
    }

    #slogan{
      margin:0;
      opacity:0.7;
      font-size:14px;
    }

    /* BEATS */
    .beat{
      padding:15px;
      border-bottom:1px solid #eee;
    }

    /* 🔥 GENRES FIX */
    .genreWrap{
      margin-top:6px;
    }

    .genre{
      display:inline-block;
      background:#222;
      color:#fff;
      padding:4px 8px;
      margin:2px;
      border-radius:6px;
      font-size:12px;
    }

    /* CART */
    #cartBox{
      position:fixed;
      right:10px;
      top:10px;
      background:#111;
      color:#fff;
      padding:10px;
      width:200px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <img id="logo" src="" alt="logo">

    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </header>

  <!-- CART -->
  <div id="cartBox">
    <h3>Cart</h3>
    <div id="cartItems"></div>
    <h4 id="cartTotal">Total: $0</h4>
    <button onclick="checkoutCart()">Checkout</button>
  </div>

  <!-- STORE -->
  <div id="store"></div>

  <!-- PLAYER -->
  <div id="playerBar">
    <div id="nowPlaying">No beat playing</div>
  </div>

  <script src="app.js"></script>

  <!-- FIREBASE + RENDER -->
  <script>
    const db = firebase.firestore();

    // SETTINGS LOAD
    db.collection("settings").doc("site").get().then(doc => {
      const s = doc.data();
      if(!s) return;

      if(s.logo) document.getElementById("logo").src = s.logo;
      if(s.storeName) document.getElementById("storeTitle").innerText = s.storeName;
      if(s.slogan) document.getElementById("slogan").innerText = s.slogan;
    });

    // LOAD BEATS
    db.collection("beats").onSnapshot(snapshot => {
      const store = document.getElementById("store");
      store.innerHTML = "";

      snapshot.forEach(doc => {
        const b = doc.data();

        store.innerHTML += `
          <div class="beat">

            <h3>${b.title}</h3>

            <p>By ${b.producer || "Unknown"}</p>

            <p>$${b.price} • ${b.tempo || ""} BPM</p>

            <!-- 🔥 GENRES FIXED DISPLAY -->
            <div class="genreWrap">
              ${(b.genres && b.genres.length)
                ? b.genres.map(g => `<span class="genre">${g}</span>`).join("")
                : ""
              }
            </div>

            <button onclick="addToCart('${doc.id}')">Add to Cart</button>

          </div>
        `;
      });
    });
  </script>

</body>
</html>
