<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
header{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px;
}

#logo{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:12px;
  background:#222;
}

.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
}

#slogan{
  margin:0;
  opacity:0.7;
  font-size:14px;
}

/* SEARCH */
#searchInput{
  width:90%;
  max-width:500px;
  margin:15px auto;
  display:block;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* STORE */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.beat-card{
  background:#1b1b22;
  padding:15px;
  border-radius:12px;
  color:white;
}

.beat-card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

button{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

/* CART */
#cartBox{
  max-width:900px;
  margin:20px auto;
  padding:15px;
  background:#181820;
  border-radius:12px;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  padding:8px;
  border-bottom:1px solid #333;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>
  <img id="logo">
  <div class="titleBlock">
    <h1 id="storeTitle">Junior Beats</h1>
    <p id="slogan">By Jayan Reid</p>
  </div>
</header>

<!-- SEARCH -->
<input id="searchInput" placeholder="Search beats..." onkeyup="searchBeats()">

<!-- CART -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
  <button onclick="checkoutCart()">Checkout</button>
</div>

<!-- STORE -->
<div id="store"></div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let cart = [];

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "";
  slogan.innerText = s.slogan || "";

  if(s.logo){
    logo.src = s.logo;
  }
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
});

/* SEARCH */
function searchBeats(){

  const value = searchInput.value.toLowerCase();

  const filtered = allBeats.filter(b=>{
    return (
      (b.title || "").toLowerCase().includes(value) ||
      (b.producer || "").toLowerCase().includes(value)
    );
  });

  renderBeats(filtered);
}

/* RENDER */
function renderBeats(beats){

  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    store.innerHTML += `
      <div class="beat-card">

        <img src="${b.image || ''}">

        <h3>${b.title || ''}</h3>

        <p>${b.producer || ''}</p>

        <p>$${b.price || 0}</p>

        <button onclick="addToCart('${b.id}')">Add to Cart</button>

      </div>
    `;
  });
}

/* ADD TO CART */
function addToCart(id){

  const beat = allBeats.find(b => b.id === id);
  if(!beat) return;

  cart.push(beat);
  renderCart();
}

/* CART RENDER */
function renderCart(){

  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  cartItems.innerHTML = "";

  let total = 0;

  cart.forEach((item, i)=>{

    total += parseFloat(item.price || 0);

    cartItems.innerHTML += `
      <div class="cartItem">
        <span>${item.title}</span>
        <span>$${item.price}</span>
        <button onclick="removeFromCart(${i})">X</button>
      </div>
    `;
  });

  cartTotal.innerText = "Total: $" + total.toFixed(2);
}

/* REMOVE */
function removeFromCart(i){
  cart.splice(i,1);
  renderCart();
}

/* CHECKOUT */
function checkoutCart(){
  alert("Checkout ready (connect PayPal here)");
}
</script>

</body>
</html>
