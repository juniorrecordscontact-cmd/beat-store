<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#0f0f12,#17171d,#111);
  color:white;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
}

/* CART (SMALLER FIX) */
#cartBox{
  max-width:900px;
  margin:10px auto;
  background:#18181d;
  border:1px solid #2a2a35;
  padding:12px;
  border-radius:10px;
  font-size:14px;
}

/* STORE GRID */
#store{
  max-width:1200px;
  margin:auto;
  padding:20px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

/* BEAT CARD */
.beat{
  background:#1a1a20;
  border:1px solid #2c2c35;
  border-radius:14px;
  padding:12px;
  transition:0.2s;
}

.beat:hover{
  transform:translateY(-4px);
  border-color:#6d3cff;
}

/* IMAGE */
.beat img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

/* TEXT */
.beat h3{
  margin:10px 0 5px;
}

.beat p{
  margin:4px 0;
  color:#bbb;
  font-size:13px;
}

/* GENRES */
.genre{
  display:inline-block;
  padding:3px 8px;
  margin:2px;
  background:#2b2b33;
  border-radius:6px;
  font-size:11px;
}

/* AUDIO */
audio{
  width:100%;
  margin-top:8px;
}

/* BUTTONS */
button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
}

/* PLAYER */
#playerBar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  padding:10px;
  border-top:1px solid #2f2f2f;
}
</style>

</head>

<body>

<header>
  <h1>🎧 Junior Beats</h1>
</header>

<!-- CART -->
<div id="cartBox">
  <h3>🛒 Cart</h3>
  <div id="cartItems"></div>
  <h4 id="cartTotal">Total: $0</h4>
</div>

<!-- STORE -->
<div id="store"></div>

<!-- PLAYER -->
<div id="playerBar">
  <div id="nowPlaying">Click a beat to play preview</div>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let cart = JSON.parse(localStorage.getItem("cart") || "[]");

/* LOAD BEATS */
db.collection("beats").onSnapshot(snap=>{
  allBeats = [];
  snap.forEach(doc=>{
    allBeats.push({ id: doc.id, ...doc.data() });
  });

  renderBeats(allBeats);
});

/* RENDER */
function renderBeats(beats){
  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{
    store.innerHTML += `
      <div class="beat">

        <img src="${b.image || ''}">

        <h3>${b.title || ''}</h3>

        <p>🎧 ${b.producer || 'Unknown'}</p>
        <p>🥁 ${b.tempo || ''} BPM</p>
        <p>$${b.price}</p>

        <div>
          ${(b.genres || []).map(g=>`<span class="genre">${g}</span>`).join("")}
        </div>

        <audio id="audio-${b.id}" src="${b.previewFile}"></audio>

        <button onclick="togglePlay('${b.id}')">▶ Play Preview</button>

        <button onclick="addToCart('${b.id}')">🛒 Add to Cart</button>

      </div>
    `;
  });
}

/* AUDIO SYSTEM (NO OVERLAP FIX) */
let currentAudio = null;

function togglePlay(id){
  const audio = document.getElementById("audio-" + id);

  if(currentAudio && currentAudio !== audio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  if(audio.paused){
    audio.play();
    currentAudio = audio;
    document.getElementById("nowPlaying").innerText = "Playing beat...";
  } else {
    audio.pause();
  }
}

/* CART SYSTEM (PERSISTENT) */
function addToCart(id){
  if(!cart.includes(id)){
    cart.push(id);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

/* CART RENDER */
function renderCart(){

  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  let total = 0;

  cart.forEach(id=>{
    const beat = allBeats.find(b=>b.id === id);
    if(!beat) return;

    total += Number(beat.price || 0);

    box.innerHTML += `
      <div>
        ${beat.title} - $${beat.price}
      </div>
    `;
  });

  document.getElementById("cartTotal").innerText = "Total: $" + total.toFixed(2);
}

renderCart();
</script>

</body>
</html>
