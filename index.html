<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
}

.leftHeader{
  display:flex;
  align-items:center;
  gap:10px;
}

#logo{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
}

.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
  font-size:18px;
}

#slogan{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

/* SEARCH (LIVE) */
#searchWrap{
  display:flex;
  align-items:center;
}

#searchInput{
  width:150px;
  padding:6px 8px;
  font-size:12px;
  border:none;
  border-radius:6px;
  background:#1e1e25;
  color:white;
  outline:none;
}

/* STORE */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:15px;
}

/* BEAT CARD */
.beat{
  background:#1a1a22;
  border-radius:12px;
  overflow:hidden;
}

.beat img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.beatContent{
  padding:10px;
}

.beat h3{
  margin:5px 0;
  font-size:14px;
}

.meta{
  font-size:11px;
  opacity:0.8;
  margin:2px 0;
}

.genres{
  font-size:10px;
  opacity:0.8;
  margin-top:5px;
}

/* BUTTONS */
.buttonGroup{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}

button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
  font-size:12px;
}

/* CART (SMALL FIXED) */
#cartBox{
  max-width:520px;
  margin:8px auto;
  padding:8px 10px;
  background:#181820;
  border-radius:10px;
  font-size:12px;
}

#cartBox h2{
  font-size:15px;
  margin:0 0 6px 0;
}

#cartItems div{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:4px 0;
  border-bottom:1px solid #222;
}

#cartItems button{
  padding:3px 6px;
  font-size:10px;
}

/* PLAYER */
#playerBar{
  padding:10px;
}

audio{
  width:100%;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>

  <div class="leftHeader">
    <img id="logo">
    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </div>

  <!-- LIVE SEARCH -->
  <div id="searchWrap">
    <input id="searchInput" placeholder="Search..." oninput="searchBeats()">
  </div>

</header>

<!-- CART -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
  <button onclick="checkoutCart()">Checkout</button>
</div>

<!-- STORE -->
<div id="store"></div>

<!-- PLAYER -->
<div id="playerBar">
  <audio id="audioPlayer" controls></audio>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let cart = [];

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "";
  slogan.innerText = s.slogan || "";
  if(s.logo) logo.src = s.logo;
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
});

/* RENDER */
function renderBeats(beats){

  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    store.innerHTML += `
      <div class="beat">

        <img src="${b.image || ''}">

        <div class="beatContent">

          <h3>${b.title || ''}</h3>

          <div class="meta">Producer: ${b.producer || 'Unknown'}</div>
          <div class="meta">BPM: ${b.tempo || 'N/A'}</div>
          <div class="meta">$${b.price || 0}</div>

          <div class="genres">
            ${(b.genres || []).join(" • ")}
          </div>

          <div class="buttonGroup">

            <button onclick="playPreview('${b.previewFile || ''}')">
              ▶ Play Preview
            </button>

            <button onclick="addToCart('${b.id}')">
              Add to Cart
            </button>

          </div>

        </div>

      </div>
    `;
  });
}

/* AUDIO */
function playPreview(url){
  if(!url) return;
  const player = document.getElementById("audioPlayer");
  player.src = url;
  player.play();
}

/* LIVE SEARCH */
function searchBeats(){

  const value = searchInput.value.toLowerCase().trim();

  if(!value){
    renderBeats(allBeats);
    return;
  }

  const filtered = allBeats.filter(b=>{
    return (
      (b.title||"").toLowerCase().includes(value) ||
      (b.producer||"").toLowerCase().includes(value) ||
      (b.tempo||"").toString().includes(value) ||
      (b.genres||[]).join(" ").toLowerCase().includes(value)
    );
  });

  renderBeats(filtered);
}

/* CART (NO DUPLICATES) */
function addToCart(id){

  if(cart.find(c=>c.id===id)) return;

  const beat = allBeats.find(b=>b.id===id);
  if(!beat) return;

  cart.push(beat);
  renderCart();
}

function renderCart(){

  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  cartItems.innerHTML = "";

  let total = 0;

  cart.forEach((item,i)=>{
    total += Number(item.price||0);

    cartItems.innerHTML += `
      <div>
        ${item.title}
        <span>
          $${item.price}
          <button onclick="removeFromCart(${i})">x</button>
        </span>
      </div>
    `;
  });

  cartTotal.innerText = "Total: $" + total.toFixed(2);
}

function removeFromCart(i){
  cart.splice(i,1);
  renderCart();
}

function checkoutCart(){
  alert("Checkout ready — payment system unchanged");
}
</script>

</body>
</html>
