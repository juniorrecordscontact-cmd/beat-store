<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
}

.leftHeader{
  display:flex;
  align-items:center;
  gap:10px;
}

#logo{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:cover;
}

.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
  font-size:18px;
}

#slogan{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

/* SEARCH */
#searchWrap input{
  width:160px;
  padding:6px 8px;
  font-size:12px;
  border:none;
  border-radius:6px;
  background:#1e1e25;
  color:white;
  outline:none;
}

/* STORE */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:15px;
}

/* BEAT CARD */
.beat{
  background:#1a1a22;
  border-radius:12px;
  overflow:hidden;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.beat:hover{
  transform: translateY(-6px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.beat img{
  width:100%;
  height:120px;
  object-fit:cover;
  transition: transform 0.3s ease;
}

.beat:hover img{
  transform: scale(1.05);
}

.beatContent{
  padding:10px;
}

.beat h3{
  margin:5px 0;
  font-size:14px;
}

.meta{
  font-size:11px;
  opacity:0.8;
}

.genres{
  font-size:10px;
  opacity:0.8;
  margin-top:5px;
}

/* BUTTONS */
.buttonGroup{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}

button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
  font-size:12px;
  transition: all 0.2s ease;
}

button:hover{
  background:#8457ff;
  transform: scale(1.02);
}

/* CART */
#cartBox{
  max-width:520px;
  margin:8px auto;
  padding:8px 10px;
  background:#181820;
  border-radius:10px;
  font-size:12px;
}

/* PLAYER */
audio{
  width:100%;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>

  <div class="leftHeader">
    <img id="logo">
    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </div>

  <div id="searchWrap">
    <input id="searchInput" placeholder="Search..." oninput="searchBeats()">
  </div>

</header>

<!-- CART -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
</div>

<!-- STORE -->
<div id="store"></div>

<!-- PLAYER -->
<div>
  <audio id="audioPlayer" controls></audio>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentBeatId = null;

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "";
  slogan.innerText = s.slogan || "";
  if(s.logo) logo.src = s.logo;
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
  renderCart();
});

/* RENDER BEATS */
function renderBeats(beats){
  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    // youtube embed
    let embed = "";
    if(b.youtubeLink){
      let id = "";

      if(b.youtubeLink.includes("youtu.be/")){
        id = b.youtubeLink.split("youtu.be/")[1];
      } else if(b.youtubeLink.includes("watch?v=")){
        id = b.youtubeLink.split("watch?v=")[1].split("&")[0];
      }

      if(id){
        embed = `https://www.youtube.com/embed/${id}`;
      }
    }

    store.innerHTML += `
      <div class="beat">

        <img src="${b.image || ''}">

        <div class="beatContent">

          <h3>${b.title || ''}</h3>

          <div class="meta">Producer: ${b.producer || 'Unknown'}</div>
          <div class="meta">BPM: ${b.tempo || 'N/A'}</div>
          <div class="meta">$${b.price || 0}</div>

          <div class="genres">
            ${(b.genres || []).join(" • ")}
          </div>

          ${embed ? `
            <div style="margin-top:8px;">
              <iframe
                width="100%"
                height="140"
                src="${embed}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
              </iframe>
            </div>
          ` : ""}

          <div class="buttonGroup">
            <button onclick="playPreview('${b.previewFile || ''}', '${b.id}')">
              ▶ Play / Pause
            </button>

            <button onclick="addToCart('${b.id}')">
              Add to Cart
            </button>
          </div>

        </div>
      </div>
    `;
  });
}

/* AUDIO */
function playPreview(url,id){
  const player = document.getElementById("audioPlayer");

  if(currentBeatId === id){
    player.paused ? player.play() : player.pause();
    return;
  }

  player.src = url;
  player.play();
  currentBeatId = id;
}

/* SEARCH */
function searchBeats(){
  const v = searchInput.value.toLowerCase();

  const filtered = allBeats.filter(b =>
    (b.title||"").toLowerCase().includes(v) ||
    (b.producer||"").toLowerCase().includes(v) ||
    (b.genres||[]).join(" ").toLowerCase().includes(v)
  );

  renderBeats(filtered);
}

/* CART */
function addToCart(id){
  if(cart.find(c=>c.id===id)) return;

  const beat = allBeats.find(b=>b.id===id);
  if(!beat) return;

  cart.push(beat);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function renderCart(){
  const cartItems = document.getElementById("cartItems");
  const cartTotal = document.getElementById("cartTotal");

  let total = 0;
  cartItems.innerHTML = "";

  cart.forEach((item,i)=>{
    total += Number(item.price||0);

    cartItems.innerHTML += `
      <div>
        ${item.title}
        <button onclick="removeFromCart(${i})">x</button>
      </div>
    `;
  });

  cartTotal.innerText = "Total: $" + total.toFixed(2);
}

function removeFromCart(i){
  cart.splice(i,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}
</script>

</body>
</html>
