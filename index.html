<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Junior Beats</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body{
      margin:0;
      transition: all 0.3s ease;
    }

    header{
      display:flex;
      align-items:center;
      gap:15px;
      padding:15px;
    }

    /* 🔥 FIXED LOGO SIZE */
    #logo{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:12px;
      flex-shrink:0;
    }

    #slogan{
      margin:0;
      opacity:0.7;
      font-size:14px;
    }

    #storeName{
      margin:0;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <!-- LOGO -->
    <img id="logo" src="" alt="logo">

    <div>
      <h1>🎧 Junior Beats</h1>

      <!-- DYNAMIC SLOGAN -->
      <p id="slogan">By Jayan Reid</p>

      <!-- STORE NAME -->
      <p id="storeName"></p>
    </div>

  </header>

  <!-- CART -->
  <div id="cartBox">
    <h2>🛒 Cart</h2>
    <div id="cartItems"></div>
    <h3 id="cartTotal">Total: $0</h3>
    <button onclick="checkoutCart()">Checkout</button>
  </div>

  <!-- STORE -->
  <div id="store"></div>

  <!-- PLAYER -->
  <div id="playerBar">
    <div id="nowPlaying">No beat playing</div>
  </div>

  <script src="app.js"></script>

  <!-- 🔥 SETTINGS PATCH (SAFE, DOES NOT TOUCH YOUR SYSTEM) -->
  <script>
    firebase.firestore()
    .collection("settings")
    .doc("site")
    .get()
    .then(doc => {

      const s = doc.data();
      if(!s) return;

      // background
      if(s.bg){
        document.body.style.backgroundImage = `url(${s.bg})`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
      }

      // font
      if(s.font){
        document.body.style.fontFamily = s.font;
      }

      // logo
      const logo = document.getElementById("logo");
      if(logo && s.logo){
        logo.src = s.logo;
      }

      // store name
      const storeName = document.getElementById("storeName");
      if(storeName && s.storeName){
        storeName.innerText = s.storeName;
      }

      // slogan
      const slogan = document.getElementById("slogan");
      if(slogan && s.slogan){
        slogan.innerText = s.slogan;
      }

    });
  </script>

</body>
</html>
