<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

/* =========================
   DESIGN SYSTEM (BEATSTARS GRID)
========================= */
:root{
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
}

/* =========================
   BASE
========================= */
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #171725, #0b0b10);
  color:white;
}

/* =========================
   HEADER
========================= */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:var(--space-4) var(--space-5);
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(12px);
  position:sticky;
  top:0;
  z-index:10;
}

.leftHeader{
  display:flex;
  align-items:center;
  gap:var(--space-3);
}

#logo{
  width:65px;
  height:65px;
  border-radius:var(--radius-md);
  object-fit:cover;
}

.titleBlock h1{
  margin:0;
  font-size:22px;
}

#slogan{
  margin:0;
  font-size:12px;
  opacity:0.7;
}

/* =========================
   SEARCH
========================= */
#searchWrap input{
  width:180px;
  padding:8px 10px;
  font-size:12px;
  border:none;
  border-radius:var(--radius-sm);
  background: rgba(255,255,255,0.08);
  color:white;
  outline:none;
}

/* =========================
   STORE GRID
========================= */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:var(--space-4);
  padding:var(--space-6);
}

/* =========================
   BEAT CARD
========================= */
.beat{
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius-md);
  overflow:hidden;
  transition: all 0.25s ease;
  backdrop-filter: blur(10px);
}

.beat:hover{
  transform: translateY(-6px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.45);
  border:1px solid rgba(255,255,255,0.15);
}

.beat img{
  width:100%;
  height:115px;
  object-fit:cover;
}

/* CONTENT */
.beatContent{
  padding:var(--space-4);
}

.beat h3{
  margin:0 0 var(--space-2) 0;
  font-size:14px;
}

/* META */
.meta{
  font-size:11px;
  opacity:0.8;
  margin:2px 0;
}

/* GENRES */
.genres span{
  font-size:10px;
  padding:3px 6px;
  border-radius:999px;
  background: rgba(255,255,255,0.08);
  margin-right:4px;
}

/* =========================
   BUTTONS
========================= */
.buttonGroup{
  display:flex;
  flex-direction:column;
  gap:var(--space-2);
  margin-top:var(--space-3);
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:var(--radius-sm);
  background: linear-gradient(135deg,#6d3cff,#8457ff);
  color:white;
  cursor:pointer;
  font-size:12px;
  transition: all 0.2s ease;
}

button:hover{
  transform: scale(1.03);
  filter: brightness(1.1);
}

/* =========================
   CART (MODULE STYLE)
========================= */
#cartBox{
  max-width:480px;
  margin:var(--space-5) auto;
  padding:var(--space-4);
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius-md);
  backdrop-filter: blur(10px);
}

#cartBox h2{
  font-size:16px;
  margin-bottom:var(--space-2);
}

#cartBox h3{
  font-size:14px;
}

#cartItems div{
  font-size:13px;
  padding:var(--space-1) 0;
}

/* =========================
   PLAYER
========================= */
audio{
  width:100%;
  margin:var(--space-4) 0;
}

</style>

</head>

<body>

<header>

  <div class="leftHeader">
    <img id="logo">
    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </div>

  <div id="searchWrap">
    <input id="searchInput" placeholder="Search..." oninput="searchBeats()">
  </div>

</header>

<!-- CART -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
</div>

<!-- STORE -->
<div id="store"></div>

<!-- PLAYER -->
<audio id="audioPlayer" controls></audio>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentBeatId = null;

/* SETTINGS (FIXED STABLE) */
const logoEl = document.getElementById("logo");
const titleEl = document.getElementById("storeTitle");
const sloganEl = document.getElementById("slogan");

db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  if(titleEl) titleEl.innerText = s.storeName || "Junior Beats";
  if(sloganEl) sloganEl.innerText = s.slogan || "By Jayan Reid";
  if(logoEl && s.logo) logoEl.src = s.logo;
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];
  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
  renderCart();
});

/* RENDER */
function renderBeats(beats){
  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    let embed = "";
    if(b.youtubeLink){
      let id = "";

      if(b.youtubeLink.includes("youtu.be/")){
        id = b.youtubeLink.split("youtu.be/")[1];
      } else if(b.youtubeLink.includes("watch?v=")){
        id = b.youtubeLink.split("watch?v=")[1].split("&")[0];
      }

      if(id){
        embed = `https://www.youtube.com/embed/${id}`;
      }
    }

    store.innerHTML += `
      <div class="beat">

        <img src="${b.image || ''}">

        <div class="beatContent">

          <h3>${b.title || ''}</h3>

          <div class="meta">Producer: ${b.producer || 'Unknown'}</div>
          <div class="meta">BPM: ${b.tempo || 'N/A'}</div>
          <div class="meta">$${b.price || 0}</div>

          <div class="genres">
            ${(b.genres || []).map(g=>`<span>${g}</span>`).join("")}
          </div>

          ${embed ? `
            <div style="margin-top:8px;">
              <iframe width="100%" height="120"
              src="${embed}"
              frameborder="0"
              allowfullscreen></iframe>
            </div>
          ` : ""}

          <div class="buttonGroup">
            <button onclick="playPreview('${b.previewFile}','${b.id}')">▶ Play</button>
            <button onclick="addToCart('${b.id}')">Add to Cart</button>
          </div>

        </div>
      </div>
    `;
  });
}

/* AUDIO */
function playPreview(url,id){
  const p = document.getElementById("audioPlayer");

  if(currentBeatId === id){
    p.paused ? p.play() : p.pause();
    return;
  }

  p.src = url;
  p.play();
  currentBeatId = id;
}

/* SEARCH */
function searchBeats(){
  const v = searchInput.value.toLowerCase();

  const filtered = allBeats.filter(b =>
    (b.title||"").toLowerCase().includes(v) ||
    (b.producer||"").toLowerCase().includes(v) ||
    (b.genres||[]).join(" ").toLowerCase().includes(v)
  );

  renderBeats(filtered);
}

/* CART */
function addToCart(id){
  if(cart.find(c=>c.id===id)) return;

  const beat = allBeats.find(b=>b.id===id);
  if(!beat) return;

  cart.push(beat);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function renderCart(){
  const items = document.getElementById("cartItems");
  const totalBox = document.getElementById("cartTotal");

  let total = 0;
  items.innerHTML = "";

  cart.forEach(i=>{
    total += Number(i.price||0);
    items.innerHTML += `<div>${i.title}</div>`;
  });

  totalBox.innerText = "Total: $" + total.toFixed(2);
}
</script>

</body>
</html>
