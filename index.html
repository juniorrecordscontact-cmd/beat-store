<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
/* HEADER */
header{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px;
}

/* LOGO SLOT (FIXED) */
#logo{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:12px;
  background:#222;
}

/* TITLE BLOCK */
.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
}

#slogan{
  margin:0;
  opacity:0.7;
  font-size:14px;
}

/* GENRE BAR */
#genreBar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:10px 15px;
}

#genreBar button{
  background:#222;
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

#genreBar button.active{
  background:#555;
}

/* GENRE TAGS */
.genre{
  display:inline-block;
  background:#2a2a2a;
  padding:4px 8px;
  border-radius:6px;
  margin:3px;
  font-size:12px;
}
</style>

</head>

<body>

<!-- HEADER (LOGO FIXED BACK HERE) -->
<header>

  <img id="logo" src="" alt="logo">

  <div class="titleBlock">
    <h1 id="storeTitle">Junior Beats</h1>
    <p id="slogan">By Jayan Reid</p>
  </div>

</header>

<!-- GENRE BAR -->
<div id="genreBar"></div>

<!-- CART (RESTORED) -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
  <button onclick="checkoutCart()">Checkout</button>
</div>

<!-- STORE -->
<div id="store"></div>

<!-- PLAYER -->
<div id="playerBar">
  <div id="nowPlaying">No beat playing</div>
</div>

<script src="app.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];
let currentGenre = "ALL";

/* SETTINGS (LOGO FIXED) */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "";
  slogan.innerText = s.slogan || "";

  if(s.logo){
    logo.src = s.logo;
  }
});

/* GENRE LIST (STABLE) */
const GENRES = [
  "Pop","Trap","HipHop","R&B","Acoustic","Electro",
  "LoFi","Drill","Dance","Jazz","Rock","Ambient",
  "Soul","Funk","Experimental"
];

/* BUILD GENRES */
function buildGenreBar(){

  const bar = document.getElementById("genreBar");

  bar.innerHTML = `
    <button onclick="filterGenre('ALL',event)" class="active">All</button>
    ${GENRES.map(g=>`
      <button onclick="filterGenre('${g}',event)">${g}</button>
    `).join("")}
  `;
}
buildGenreBar();

/* FILTER */
function filterGenre(genre,e){
  currentGenre = genre;

  document.querySelectorAll("#genreBar button")
    .forEach(b=>b.classList.remove("active"));

  e.target.classList.add("active");

  renderBeats(allBeats);
}

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
});

/* RENDER (FULL FIX RESTORED) */
function renderBeats(beats){

  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    const genres = Array.isArray(b.genres) ? b.genres : [];

    if(currentGenre !== "ALL"){
      if(!genres.includes(currentGenre)) return;
    }

    store.innerHTML += `
      <div class="beat-card">

        <img src="${b.image || ''}" />

        <h3>${b.title || ''}</h3>

        <p>${b.producer || ''}</p>

        <p>$${b.price || 0} • ${b.tempo || ''} BPM</p>

        <div>
          ${genres.map(g=>`<span class="genre">${g}</span>`).join("")}
        </div>

        <button onclick="addToCart('${b.id}')">Add to Cart</button>

      </div>
    `;
  });
}
</script>

</body>
</html>
