<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f12;
  color:white;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
}

#logo{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

.titleBlock{
  display:flex;
  flex-direction:column;
}

#storeTitle{
  margin:0;
  font-size:20px;
}

#slogan{
  margin:0;
  opacity:0.7;
  font-size:13px;
}

/* SEARCH (SMALL) */
#searchWrap{
  display:flex;
  gap:8px;
  padding:10px 15px;
}

#searchInput{
  flex:1;
  max-width:320px;
  padding:8px 10px;
  border:none;
  border-radius:8px;
  background:#1e1e25;
  color:white;
  font-size:13px;
  outline:none;
}

#searchBtn{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  font-size:13px;
  cursor:pointer;
}

/* CART (SMALL) */
#cartBox{
  max-width:750px;
  margin:15px auto;
  padding:12px;
  background:#181820;
  border-radius:10px;
}

#cartBox h2{
  margin:0 0 10px 0;
  font-size:18px;
}

/* STORE */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
  padding:20px;
}

/* BEAT CARD */
.beat{
  background:#1a1a22;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
  transition:0.2s;
}

.beat:hover{
  transform:translateY(-4px);
}

.beat img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.beatContent{
  padding:10px;
}

.beat h3{
  margin:5px 0;
  font-size:15px;
}

.meta{
  font-size:12px;
  opacity:0.8;
  margin:3px 0;
}

.genres{
  margin-top:5px;
  font-size:11px;
  opacity:0.9;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#6d3cff;
  color:white;
  cursor:pointer;
  margin-top:10px;
}
</style>

</head>

<body>

<!-- HEADER -->
<header>
  <img id="logo">
  <div class="titleBlock">
    <h1 id="storeTitle">Junior Beats</h1>
    <p id="slogan">By Jayan Reid</p>
  </div>
</header>

<!-- SEARCH -->
<div id="searchWrap">
  <input id="searchInput" placeholder="Search beats..." onkeypress="handleEnter(event)">
  <button id="searchBtn" onclick="searchBeats()">Search</button>
</div>

<!-- CART -->
<div id="cartBox">
  <h2>🛒 Cart</h2>
  <div id="cartItems"></div>
  <h3 id="cartTotal">Total: $0</h3>
  <button onclick="checkoutCart()">Checkout</button>
</div>

<!-- STORE -->
<div id="store"></div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats = [];

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(doc=>{
  const s = doc.data();
  if(!s) return;

  storeTitle.innerText = s.storeName || "";
  slogan.innerText = s.slogan || "";
  if(s.logo) logo.src = s.logo;
});

/* LOAD BEATS */
db.collection("beats").onSnapshot(snapshot=>{
  allBeats = [];

  snapshot.forEach(doc=>{
    allBeats.push({id:doc.id,...doc.data()});
  });

  renderBeats(allBeats);
});

/* RENDER */
function renderBeats(beats){

  const store = document.getElementById("store");
  store.innerHTML = "";

  beats.forEach(b=>{

    store.innerHTML += `
      <div class="beat">

        <img src="${b.image || ''}">

        <div class="beatContent">

          <h3>${b.title || ''}</h3>

          <div class="meta">Producer: ${b.producer || 'Unknown'}</div>
          <div class="meta">BPM: ${b.tempo || 'N/A'}</div>
          <div class="meta">Price: $${b.price || 0}</div>

          <div class="genres">
            ${(b.genres || []).join(" • ")}
          </div>

          <button onclick="addToCart('${b.id}')">Add to Cart</button>

        </div>

      </div>
    `;
  });
}

/* SEARCH */
function searchBeats(){

  const value = searchInput.value.toLowerCase().trim();

  if(value === ""){
    renderBeats(allBeats);
    return;
  }

  const filtered = allBeats.filter(b=>{

    return (
      (b.title || "").toLowerCase().includes(value) ||
      (b.producer || "").toLowerCase().includes(value) ||
      (b.tempo || "").toString().includes(value) ||
      (b.genres || []).join(" ").toLowerCase().includes(value)
    );
  });

  renderBeats(filtered);
}

/* ENTER KEY */
function handleEnter(e){
  if(e.key === "Enter"){
    searchBeats();
  }
}
</script>

</body>
</html>
