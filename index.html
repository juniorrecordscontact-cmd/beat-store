<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Junior Beats</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="https://unpkg.com/wavesurfer.js"></script>

<style>

/* ================= DESIGN SYSTEM ================= */
:root{
  --space-1:4px;
  --space-2:8px;
  --space-3:12px;
  --space-4:16px;
  --space-5:20px;
  --space-6:24px;
  --radius:12px;
}

/* ================= BASE ================= */
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #171725, #0b0b10);
  color:white;
}

/* ================= HEADER ================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:var(--space-4);
  background:rgba(0,0,0,0.35);
  backdrop-filter: blur(12px);
  position:sticky;
  top:0;
  z-index:10;
}

.leftHeader{
  display:flex;
  align-items:center;
  gap:12px;
}

#logo{
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
}

#storeTitle{
  font-size:20px;
  margin:0;
}

#slogan{
  font-size:12px;
  opacity:0.7;
  margin:0;
}

/* ================= FILTER BAR ================= */
#filters{
  display:flex;
  gap:10px;
  padding:12px;
  overflow-x:auto;
}

.filterBtn{
  padding:6px 10px;
  border-radius:999px;
  border:none;
  cursor:pointer;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:12px;
}

.filterBtn.active{
  background:#6d3cff;
}

/* ================= FEATURED ================= */
#featured{
  padding:12px;
  font-size:14px;
  opacity:0.8;
}

/* ================= STORE ================= */
#store{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  padding:16px;
}

/* ================= CARD ================= */
.beat{
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.2s;
}

.beat:hover{
  transform:translateY(-5px);
}

.beat img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.beatContent{
  padding:12px;
}

.meta{
  font-size:11px;
  opacity:0.8;
}

/* WAVEFORM */
.wave{
  height:40px;
  margin-top:8px;
}

/* ================= BUTTONS ================= */
button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#6d3cff,#8457ff);
  color:white;
  cursor:pointer;
  font-size:12px;
}

.buttonGroup{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:10px;
}

/* ================= CART ================= */
#cartBox{
  max-width:480px;
  margin:12px auto;
  padding:12px;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
}

.cartItem{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 0;
  font-size:13px;
}

.removeBtn{
  background:red;
  border:none;
  border-radius:6px;
  padding:2px 6px;
  font-size:10px;
  cursor:pointer;
}

/* ================= STICKY PLAYER ================= */
#playerBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter: blur(10px);
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

#waveform{
  flex:1;
  height:50px;
}

</style>

</head>

<body>

<header>
  <div class="leftHeader">
    <img id="logo">
    <div>
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>
  </div>
</header>

<!-- FILTERS -->
<div id="filters">
  <button class="filterBtn active" onclick="filter('all')">All</button>
  <button class="filterBtn" onclick="filter('trap')">Trap</button>
  <button class="filterBtn" onclick="filter('pop')">Pop</button>
  <button class="filterBtn" onclick="filter('lofi')">Lofi</button>
</div>

<div id="featured">🔥 Featured Beats</div>

<div id="cartBox">
  <h3>Cart</h3>
  <div id="cartItems"></div>
  <h4 id="total"></h4>
</div>

<div id="store"></div>

<!-- STICKY PLAYER -->
<div id="playerBar">
  <div id="waveform"></div>
</div>

<script>
firebase.initializeApp({
apiKey:"AIzaSyD2y_gXSvYFe4OIXkns2Euwcgk73DV83fw",
authDomain:"junior-beats-store.firebaseapp.com",
projectId:"junior-beats-store"
});

const db = firebase.firestore();

let allBeats=[];
let cart=[];
let wavesurfer=null;
let currentAudio=null;

/* SETTINGS */
db.collection("settings").doc("site").onSnapshot(d=>{
  const s=d.data();
  if(!s) return;

  document.getElementById("logo").src=s.logo||"";
  document.getElementById("storeTitle").innerText=s.storeName||"Junior Beats";
  document.getElementById("slogan").innerText=s.slogan||"By Jayan Reid";
});

/* LOAD */
db.collection("beats").onSnapshot(s=>{
  allBeats=[];
  s.forEach(d=>allBeats.push({id:d.id,...d.data()}));
  render(allBeats);
});

/* RENDER */
function render(list){
  const store=document.getElementById("store");
  store.innerHTML="";

  list.forEach(b=>{
    store.innerHTML+=`
      <div class="beat">

        <img src="${b.image||''}">

        <div class="beatContent">

          <div class="meta">${b.title}</div>
          <div class="meta">${b.producer}</div>
          <div class="meta">$${b.price}</div>

          <div class="buttonGroup">
            <button onclick="play('${b.previewFile}')">▶ Play</button>
            <button onclick="add('${b.id}')">Add</button>
          </div>

        </div>

      </div>
    `;
  });
}

/* WAVE PLAYER */
function initWave(url){
  if(wavesurfer) wavesurfer.destroy();

  wavesurfer = WaveSurfer.create({
    container:"#waveform",
    waveColor:"#888",
    progressColor:"#6d3cff",
    height:50
  });

  wavesurfer.load(url);
}

/* PLAY */
function play(url){
  currentAudio=url;
  initWave(url);
}

/* CART */
function add(id){
  const b=allBeats.find(x=>x.id===id);
  if(!b) return;

  cart.push(b);
  renderCart();
}

function remove(i){
  cart.splice(i,1);
  renderCart();
}

function renderCart(){
  let total=0;
  const box=document.getElementById("cartItems");
  box.innerHTML="";

  cart.forEach((c,i)=>{
    total+=Number(c.price||0);

    box.innerHTML+=`
      <div class="cartItem">
        ${c.title}
        <button class="removeBtn" onclick="remove(${i})">X</button>
      </div>
    `;
  });

  document.getElementById("total").innerText="Total: $"+total;
}

/* FILTER */
function filter(type){
  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");

  if(type==="all") return render(allBeats);

  render(allBeats.filter(b=>
    (b.genres||[]).includes(type)
  ));
}
</script>

</body>
</html>
