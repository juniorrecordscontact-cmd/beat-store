<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Junior Beats</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body{
      margin:0;
      transition: all 0.3s ease;
    }

    header{
      display:flex;
      align-items:center;
      gap:12px;
      padding:15px;
    }

    #logo{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:12px;
      background:#222;
    }

    .titleBlock{
      display:flex;
      flex-direction:column;
    }

    #storeTitle{
      margin:0;
      font-size:22px;
    }

    #slogan{
      margin:0;
      opacity:0.7;
      font-size:14px;
    }

    /* GENRE BAR */
    #genreBar{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:10px 15px;
    }

    #genreBar button{
      background:#2a2a2a;
      color:white;
      border:none;
      padding:6px 10px;
      border-radius:6px;
      cursor:pointer;
    }

    #genreBar button.active{
      background:#555;
    }

    /* SEARCH */
    #searchWrap{
      padding:10px 15px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #searchInput{
      flex:1;
      max-width:400px;
      padding:10px;
      border:none;
      border-radius:8px;
      background:#222;
      color:white;
      outline:none;
    }

    #searchBtn{
      width:auto;
      padding:10px 16px;
      border:none;
      border-radius:8px;
      background:#6d3cff;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <img id="logo" src="" alt="logo">

    <div class="titleBlock">
      <h1 id="storeTitle">Junior Beats</h1>
      <p id="slogan">By Jayan Reid</p>
    </div>

  </header>

  <!-- GENRE FILTER BAR -->
  <div id="genreBar"></div>

  <!-- SEARCH -->
  <div id="searchWrap">

    <input
      type="text"
      id="searchInput"
      placeholder="Search beats..."
      onkeypress="handleSearchEnter(event)"
    >

    <button id="searchBtn" onclick="searchBeats()">
      🔍 Search
    </button>

  </div>

  <!-- CART -->
  <div id="cartBox">
    <h2>🛒 Cart</h2>
    <div id="cartItems"></div>
    <h3 id="cartTotal">Total: $0</h3>
    <button onclick="checkoutCart()">Checkout</button>
  </div>

  <!-- STORE -->
  <div id="store"></div>

  <!-- PLAYER -->
  <div id="playerBar">
    <div id="nowPlaying"></div>
  </div>

  <script src="app.js"></script>

  <!-- FIREBASE + GENRE SYSTEM -->
  <script>
    const db = firebase.firestore();

    let allBeats = [];

    // LOAD SETTINGS
    db.collection("settings").doc("site").get().then(doc => {
      const s = doc.data();
      if(!s) return;

      if(s.logo) document.getElementById("logo").src = s.logo;
      if(s.storeName) document.getElementById("storeTitle").innerText = s.storeName;
      if(s.slogan) document.getElementById("slogan").innerText = s.slogan;
    });

    // LOAD BEATS
    db.collection("beats").onSnapshot(snapshot => {
      allBeats = [];

      snapshot.forEach(doc => {
        allBeats.push({ id: doc.id, ...doc.data() });
      });

      renderBeats(allBeats);
      buildGenreBar(allBeats);
    });

    // RENDER BEATS
    function renderBeats(beats){

      const store = document.getElementById("store");
      store.innerHTML = "";

      beats.forEach(b => {

        store.innerHTML += `
          <div class="beat" data-genres="${(b.genres||[]).join(',')}">

            <h3>${b.title}</h3>

            <div>
              ${(b.genres||[]).map(g => `<span class="genre">${g}</span>`).join(" ")}
            </div>

            <p>$${b.price}</p>

            <button onclick="addToCart('${b.id}')">
              Add to Cart
            </button>

          </div>
        `;
      });
    }

    // BUILD GENRE BUTTONS
    function buildGenreBar(beats){

      const genreSet = new Set();

      beats.forEach(b => {
        (b.genres || []).forEach(g => genreSet.add(g));
      });

      const bar = document.getElementById("genreBar");

      bar.innerHTML = `
        <button onclick="filterGenre('ALL')" class="active">
          All Beats
        </button>

        ${[...genreSet].map(g => `
          <button onclick="filterGenre('${g}')">
            ${g}
          </button>
        `).join("")}
      `;
    }

    // FILTER SYSTEM
    function filterGenre(genre){

      document.querySelectorAll("#genreBar button").forEach(b=>{
        b.classList.remove("active");
      });

      event.target.classList.add("active");

      const cards = document.querySelectorAll(".beat");

      cards.forEach(card => {

        const genres = card.getAttribute("data-genres") || "";

        if(genre === "ALL"){
          card.style.display = "block";
        } else {
          card.style.display =
            genres.includes(genre)
            ? "block"
            : "none";
        }

      });
    }

    // SEARCH SYSTEM
    function searchBeats(){

      const value = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

      const cards = document.querySelectorAll(".beat");

      cards.forEach(card => {

        const text = card.innerText.toLowerCase();

        if(text.includes(value)){
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }

      });
    }

    // ENTER KEY SUPPORT
    function handleSearchEnter(e){
      if(e.key === "Enter"){
        searchBeats();
      }
    }

  </script>

</body>
</html>
