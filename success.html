<!DOCTYPE html>
<html>
<head>
  <title>Purchase Complete</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 60px;
    }

    .box {
      background: #1b1b1b;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 18px;
      background: purple;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🎉 Purchase Complete</h1>
  <p>Your beat is ready to download.</p>

  <a id="downloadBtn" href="#">Download Beat</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");

  document.getElementById("downloadBtn").href = file;
</script>

</body>
</html>
